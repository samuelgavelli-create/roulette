/* =====================================================================
   Roulette di Casa · 1.0.1 — grafica «Arcade»
   Tutto in rem: con «Testo grande» (o il testo grande del telefono) cresce
   tutto in proporzione. Tema chiaro e scuro, automatico o a scelta.
   ===================================================================== */
:root{
  --f-corpo:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-titoli:'Baloo 2','Nunito',system-ui,sans-serif;
  --bg:#EEF1FB; --bg-vetro:rgba(238,241,251,.88); --bg-a:#FFE7C2; --bg-b:#D9D2FF;
  --st-bg:linear-gradient(160deg,#FFF4E4,#FFDCBC); --st-bord:#F3C99C; --st-ink:#7A4518; --st-pall:rgba(122,69,24,.18);
  --card:#FFFFFF; --ink:#1D2140; --ink2:#59618A; --ink3:#8A91B4;
  --bord:#DCE1F2; --bord2:#C9D0E8; --track:#E6E9F6;
  --viola:#7B61FF; --viola-d:#5A43D6; --viola-l:#EEEAFF;
  --verde:#2EC27E; --verde-d:#1E9460; --verde-l:#E3F8EE;
  --arancio:#FF7A1A; --arancio-d:#D45A00; --arancio-l:#FFF0E3;
  --rosso:#FF4D5A; --rosso-d:#C93A45; --rosso-l:#FFE8EA;
  --oro:#FFC94D; --oro-d:#E09A10; --oro-ink:#4A3000; --oro-l:#FFF6DC;
  --blu:#3D8BFF; --blu-d:#2565C9; --blu-l:#E6F0FF;
  --ombra:0 4px 0 var(--bord);
  --tab:#FFFFFF;
  --vel:rgba(20,22,46,.42);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="chiaro"]){
    --bg:#12152B; --bg-vetro:rgba(18,21,43,.88); --bg-a:#3A2A1A; --bg-b:#2A2560;
    --st-bg:linear-gradient(160deg,#3B2B20,#2A1E17); --st-bord:#55402F; --st-ink:#F5D2AC; --st-pall:rgba(245,210,172,.2);
    --card:#1C2142; --ink:#F1F3FF; --ink2:#A7AFD6; --ink3:#7A82AD;
    --bord:#2C3466; --bord2:#0B0E22; --track:#272E58;
    --viola:#9B87FF; --viola-d:#6A52E6; --viola-l:#2A2760;
    --verde:#34D08A; --verde-d:#1E9460; --verde-l:#173A33;
    --arancio:#FF8A33; --arancio-d:#C95300; --arancio-l:#3A2A20;
    --rosso:#FF5C68; --rosso-d:#B8323D; --rosso-l:#3E1E2A;
    --oro:#FFC94D; --oro-d:#D48E0C; --oro-ink:#4A3000; --oro-l:#3A3218;
    --blu:#5A9BFF; --blu-d:#2A62C2; --blu-l:#1E2E55;
    --ombra:0 4px 0 #0B0E22; --tab:#171B38; --vel:rgba(4,6,18,.62);
    color-scheme:dark;
  }
}
:root[data-tema="scuro"]{
  --bg:#12152B; --bg-vetro:rgba(18,21,43,.88); --bg-a:#3A2A1A; --bg-b:#2A2560;
  --st-bg:linear-gradient(160deg,#3B2B20,#2A1E17); --st-bord:#55402F; --st-ink:#F5D2AC; --st-pall:rgba(245,210,172,.2);
  --card:#1C2142; --ink:#F1F3FF; --ink2:#A7AFD6; --ink3:#7A82AD;
  --bord:#2C3466; --bord2:#0B0E22; --track:#272E58;
  --viola:#9B87FF; --viola-d:#6A52E6; --viola-l:#2A2760;
  --verde:#34D08A; --verde-d:#1E9460; --verde-l:#173A33;
  --arancio:#FF8A33; --arancio-d:#C95300; --arancio-l:#3A2A20;
  --rosso:#FF5C68; --rosso-d:#B8323D; --rosso-l:#3E1E2A;
  --oro:#FFC94D; --oro-d:#D48E0C; --oro-ink:#4A3000; --oro-l:#3A3218;
  --blu:#5A9BFF; --blu-d:#2A62C2; --blu-l:#1E2E55;
  --ombra:0 4px 0 #0B0E22; --tab:#171B38; --vel:rgba(4,6,18,.62);
  color-scheme:dark;
}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.grande{font-size:112.5%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-corpo);font-size:1rem;line-height:1.38;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,select,textarea{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--viola);outline-offset:2px;border-radius:12px}
.i{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.pieno{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nascosto{display:none!important}

/* ---------- impalcatura ---------- */
#app{max-width:30rem;margin:0 auto;min-height:100vh;position:relative}
.testata{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;
  padding:calc(.75rem + env(safe-area-inset-top)) 1rem .6rem;background:var(--bg-vetro);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.av{width:2.75rem;height:2.75rem;border-radius:.9rem;display:grid;place-items:center;font-family:var(--f-titoli);font-weight:800;
  font-size:1rem;color:#fff;background:var(--c,#7B61FF);box-shadow:0 3px 0 rgba(0,0,0,.18);flex:none;position:relative;letter-spacing:.02em}
.av.chiaro{color:#1D2140}
.av.p{width:2rem;height:2rem;border-radius:.65rem;font-size:.75rem;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.av.xp{width:1.5rem;height:1.5rem;border-radius:.5rem;font-size:.625rem;box-shadow:none}
.av.g{width:4.5rem;height:4.5rem;border-radius:1.4rem;font-size:1.6rem}
.av .pallino{position:absolute;top:-.2rem;right:-.2rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--rosso);border:2px solid var(--bg)}
.t-txt{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.t-txt b{font-family:var(--f-titoli);font-weight:800;font-size:1.45rem;line-height:1.05}
.t-txt span{font-size:.8125rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-pt{display:flex;align-items:center;gap:.4rem;padding:.35rem .75rem .35rem .4rem;border-radius:99px;background:var(--card);
  border:2px solid var(--bord);box-shadow:0 3px 0 var(--bord);flex:none}
.t-pt b{font-family:var(--f-titoli);font-weight:800;font-size:1.05rem;line-height:1}
.t-pt small{font-size:.75rem;color:var(--ink2);font-weight:700}
.moneta{width:1.45rem;height:1.45rem;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#FFE58A,#FFB61A 60%,#E8920C);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.vista{padding:.25rem 1rem calc(6.5rem + env(safe-area-inset-bottom))}
.giorno{font-family:var(--f-titoli);font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin:.25rem .15rem .6rem}
.sez{margin-top:1.4rem}
.sez-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin:0 .15rem .6rem}
h2{font-family:var(--f-titoli);font-weight:800;font-size:1.3rem;line-height:1.15;margin:0 .15rem .6rem}
.sez-h h2{margin:0}
.sez-a{font-size:.8125rem;color:var(--ink2);font-weight:800;white-space:nowrap}
h3{font-family:var(--f-titoli);font-weight:800;font-size:1.1rem;line-height:1.2}
p.nota,.nota{font-size:.8125rem;color:var(--ink2)}
.lnk{color:var(--viola);font-weight:800;font-size:.875rem;padding:.25rem 0;text-align:left}

/* ---------- card ---------- */
.card{background:var(--card);border:2px solid var(--bord);border-radius:1.25rem;box-shadow:var(--ombra);padding:.85rem}
.card+.card{margin-top:.75rem}
.card.piatta{box-shadow:none}
.riga{display:flex;align-items:center;gap:.75rem;min-height:3rem}
.riga+.riga{margin-top:.6rem}
.card .riga+.riga{padding-top:.6rem;border-top:2px dashed var(--track)}
.ic{width:2.6rem;height:2.6rem;border-radius:.85rem;display:grid;place-items:center;flex:none;color:#fff;background:var(--k,var(--viola));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ic .i{width:1.35rem;height:1.35rem}
.ic.chiaro{color:#1D2140}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.rt b{font-size:1rem;line-height:1.2;font-weight:800}
.rt span,.rt small{font-size:.8125rem;color:var(--ink2);line-height:1.3}
.rt .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.rt b.fissa{display:inline;font-size:inherit;line-height:inherit;color:var(--viola)}

/* ---------- bottoni 3D ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:0 1rem;border-radius:.9rem;
  font-family:var(--f-titoli);font-weight:800;font-size:1rem;line-height:1;white-space:nowrap;color:#fff;
  background:var(--verde);box-shadow:0 4px 0 var(--verde-d);transition:transform .08s,box-shadow .08s;flex:none;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--verde-d)}
.btn .pt{font-family:var(--f-corpo);font-size:.8rem;font-weight:900;background:rgba(255,255,255,.26);padding:.12rem .45rem;border-radius:99px}
.btn.viola{background:var(--viola);box-shadow:0 4px 0 var(--viola-d)}
.btn.viola:active:not(:disabled){box-shadow:0 1px 0 var(--viola-d)}
.btn.oro{background:var(--oro);color:var(--oro-ink);box-shadow:0 4px 0 var(--oro-d)}
.btn.oro:active:not(:disabled){box-shadow:0 1px 0 var(--oro-d)}
.btn.oro .pt{background:rgba(74,48,0,.12)}
.btn.blu{background:var(--blu);box-shadow:0 4px 0 var(--blu-d)}
.btn.blu:active:not(:disabled){box-shadow:0 1px 0 var(--blu-d)}
.btn.rosso{background:var(--rosso);box-shadow:0 4px 0 var(--rosso-d)}
.btn.rosso:active:not(:disabled){box-shadow:0 1px 0 var(--rosso-d)}
.btn.arancio{background:var(--arancio);box-shadow:0 4px 0 var(--arancio-d)}
.btn.bianco{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--bord2);border:2px solid var(--bord)}
.btn.bianco:active:not(:disabled){box-shadow:0 1px 0 var(--bord2)}
.btn.tenue{background:var(--track);color:var(--ink2);box-shadow:0 3px 0 var(--bord2)}
.btn.largo{width:100%;min-height:3.1rem;font-size:1.1rem}
.btn.p{min-height:2.3rem;padding:0 .75rem;font-size:.9rem;border-radius:.75rem}
.btn:disabled{background:var(--track);color:var(--ink3);box-shadow:0 3px 0 var(--bord2)}
.btn-ico{width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;color:var(--ink2);flex:none}
.btn-ico:active{background:var(--track)}
.fatto-ok{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-titoli);font-weight:800;color:var(--verde-d);font-size:1rem;
  min-height:2.75rem;padding:0 .5rem;flex:none}
:root[data-tema="scuro"] .fatto-ok{color:var(--verde)}
@media (prefers-color-scheme:dark){:root:not([data-tema="chiaro"]) .fatto-ok{color:var(--verde)}}
.fatto-ok .av{margin-right:.15rem}

/* ---------- etichette ---------- */
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:900;padding:.18rem .5rem;border-radius:99px;
  background:var(--track);color:var(--ink2);white-space:nowrap}
.tag.oro{background:var(--oro);color:var(--oro-ink)}
.tag.viola{background:var(--viola-l);color:var(--viola)}
.tag.verde{background:var(--verde-l);color:var(--verde-d)}
.tag.rosso{background:var(--rosso-l);color:var(--rosso)}
.tag.blu{background:var(--blu-l);color:var(--blu)}
.tag .i{width:.85rem;height:.85rem}
.sticker{display:inline-block;font-family:var(--f-titoli);font-weight:800;font-size:.8rem;padding:.25rem .65rem;border-radius:.6rem;
  background:#fff;color:var(--arancio-d);transform:rotate(-4deg);box-shadow:0 3px 0 rgba(0,0,0,.15)}

/* ---------- barre ---------- */
.barra{height:.95rem;border-radius:99px;background:var(--track);border:2px solid var(--bord);overflow:hidden;position:relative}
.barra>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verde),#5BE0A2);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.barra.viola>i{background:repeating-linear-gradient(-45deg,#9B87FF 0 .6rem,#7B61FF .6rem 1.2rem)}
.barra.oro>i{background:repeating-linear-gradient(-45deg,#FFD36E 0 .6rem,#FFC21A .6rem 1.2rem)}
.prog{margin:0 .15rem .75rem}
.prog-t{display:flex;justify-content:space-between;font-size:.8125rem;font-weight:800;color:var(--ink2);margin-bottom:.35rem}
.seg{display:flex;height:1.6rem;border-radius:99px;overflow:hidden;background:var(--track);border:2px solid var(--bord)}
.seg>i{display:block;height:100%;background:var(--c);box-shadow:inset -2px 0 0 rgba(255,255,255,.55);transition:flex-grow .6s}
.seg>i.bonus{background:repeating-linear-gradient(-45deg,#FFD36E 0 .5rem,#FFC21A .5rem 1rem)}
.leg{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.4rem .9rem;margin:.75rem 0 .5rem}
.leg li{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:700;min-width:0}
.leg li i{width:.8rem;height:.8rem;border-radius:.25rem;background:var(--c);flex:none}
.leg li b{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- missioni ---------- */
.mcard{display:flex;align-items:center;gap:.75rem;padding:.75rem;background:var(--card);border:2px solid var(--bord);
  border-radius:1.25rem;box-shadow:var(--ombra);margin-bottom:.75rem;position:relative}
.mcard.fatta{background:linear-gradient(0deg,var(--verde-l),var(--verde-l));border-color:color-mix(in srgb,var(--verde) 45%,var(--bord));
  box-shadow:0 4px 0 color-mix(in srgb,var(--verde) 45%,var(--bord))}
.mcard.fatta .rt b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--verde) 70%,transparent);text-decoration-thickness:2px}
.mcard.oro{border-color:var(--oro);box-shadow:0 4px 0 var(--oro-d)}
.mcard.rubata{border-color:var(--rosso);box-shadow:0 4px 0 var(--rosso-d)}
.mcard.persa{opacity:.6}
.mcard .menu{position:absolute;top:.2rem;right:.2rem;width:2rem;height:2rem}

/* ---------- avvisi forti: bidoni ---------- */
.allarme{border-radius:1.4rem;padding:1rem;color:#fff;background:var(--arancio);box-shadow:0 5px 0 var(--arancio-d);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.10) 0 .9rem,transparent .9rem 1.8rem);position:relative;margin-bottom:.75rem}
.allarme.urgente{background-color:var(--rosso);box-shadow:0 5px 0 var(--rosso-d);animation:pulsa 1.6s ease-in-out infinite}
.allarme.ok{background:var(--verde);box-shadow:0 5px 0 var(--verde-d);background-image:none}
.al-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.4rem}
.al-tag{font-family:var(--f-titoli);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.95}
.al-tit{display:flex;align-items:center;gap:.6rem;font-family:var(--f-titoli);font-weight:800;font-size:1.55rem;line-height:1.05}
.al-tit .i{width:1.8rem;height:1.8rem}
.al-sub{font-size:.875rem;margin:.35rem 0 .75rem;opacity:.95}
.al-righe{display:flex;flex-direction:column;gap:.5rem}
.al-riga{display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.16);border-radius:1rem;padding:.5rem .5rem .5rem .6rem}
.al-riga .rt b{color:#fff}
.al-riga .rt span{color:rgba(255,255,255,.9)}
.al-riga .btn.bianco{color:var(--arancio-d);border:0;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.allarme.urgente .al-riga .btn.bianco{color:var(--rosso-d)}
.tipo{width:.85rem;height:.85rem;border-radius:.28rem;background:var(--c);display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
@keyframes pulsa{0%,100%{transform:none}50%{transform:scale(1.012)}}
.prossimo{display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;border-radius:1rem;background:var(--card);border:2px dashed var(--bord);
  font-size:.875rem;color:var(--ink2);margin-bottom:.5rem}

/* ---------- carte colorate ---------- */
.cta{border-radius:1.4rem;padding:1rem;color:#fff;background:var(--viola);box-shadow:0 5px 0 var(--viola-d);position:relative;overflow:hidden}
.cta h3{font-size:1.45rem;color:#fff;position:relative;padding-right:3rem}
.cta p{font-size:.875rem;opacity:.95;margin:.25rem 0 .85rem}
.cta .deco{position:absolute;right:-2.5rem;top:-2.5rem;width:6.2rem;height:6.2rem;border-radius:50%;opacity:.95;
  background:conic-gradient(#FF5A5F 0 45deg,#FFAE1A 0 90deg,#00B3A4 0 135deg,#3D8BFF 0 180deg,#FF5A5F 0 225deg,#FFAE1A 0 270deg,#00B3A4 0 315deg,#3D8BFF 0 360deg);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.9)}
.cta .btn{position:relative}
.lav{display:flex;align-items:center;gap:.75rem;border-radius:1.25rem;padding:.8rem .85rem;color:#fff;background:var(--blu);box-shadow:0 4px 0 var(--blu-d)}
.lav .rt b{font-family:var(--f-titoli);font-size:1.15rem;color:#fff}
.lav .rt span{color:rgba(255,255,255,.9)}
.lav .ic{background:#fff;color:var(--blu);box-shadow:none}
.lav.finita{background:linear-gradient(135deg,#3D8BFF,#7B61FF);animation:pulsa 1.6s ease-in-out infinite}
.lav.ferma{background:var(--card);color:var(--ink);border:2px solid var(--bord);box-shadow:var(--ombra)}
.lav.ferma .rt b{color:var(--ink)}
.lav.ferma .rt span{color:var(--ink2)}
.lav.ferma .ic{background:var(--blu);color:#fff}
.lav-barra{display:block;height:.45rem;border-radius:99px;background:rgba(255,255,255,.28);margin-top:.35rem;overflow:hidden}
.lav-barra i{display:block;height:100%;border-radius:99px;background:#fff}
@keyframes pulsa{0%,100%{box-shadow:0 4px 0 var(--blu-d),0 0 0 0 rgba(123,97,255,.45)}50%{box-shadow:0 4px 0 var(--blu-d),0 0 0 .5rem rgba(123,97,255,0)}}
.giallo{border-radius:1.4rem;padding:1rem;background:var(--oro);color:var(--oro-ink);box-shadow:0 5px 0 var(--oro-d)}
.giallo h3,.giallo b{color:var(--oro-ink)}
.giallo .nota{color:rgba(74,48,0,.8)}
.giallo .ic{background:#fff;color:var(--oro-d);box-shadow:none}
.mese .barra{height:1.15rem}
.mese .cifre{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.6rem}
.mese .cifre b{font-family:var(--f-titoli);font-weight:800;font-size:1.25rem}
.mese .cifre span{font-size:.875rem;font-weight:800;color:var(--ink2)}
.grande-num{font-family:var(--f-titoli);font-weight:800;font-size:2.8rem;line-height:1}
.grande-num small{font-size:1rem;color:var(--ink2);font-weight:700;margin-left:.3rem}

/* ---------- campi ---------- */
.inp{width:100%;min-height:2.9rem;padding:.6rem .85rem;border-radius:.9rem;border:2px solid var(--bord);background:var(--card);
  font-size:1rem;color:var(--ink);box-shadow:inset 0 2px 0 rgba(0,0,0,.04)}
.inp:focus{border-color:var(--viola);outline:none}
.inp::placeholder{color:var(--ink3)}
textarea.inp{min-height:5rem;resize:vertical}
.fila{display:flex;gap:.5rem;align-items:center}
.fila>.inp{flex:1;min-width:0}
.campo{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.campo>span{font-size:.8125rem;font-weight:800;color:var(--ink2)}
.scelte{display:flex;flex-wrap:wrap;gap:.45rem}
.scelta{min-height:2.6rem;padding:0 .9rem;border-radius:.8rem;border:2px solid var(--bord);background:var(--card);font-weight:800;font-size:.95rem;
  box-shadow:0 3px 0 var(--bord)}
.scelta.on{background:var(--viola);border-color:var(--viola);color:#fff;box-shadow:0 3px 0 var(--viola-d)}
.scelta:disabled{opacity:.45}
.seg-ctrl{display:flex;background:var(--track);border-radius:1rem;padding:.25rem;gap:.25rem;margin-bottom:1rem}
.seg-ctrl button{flex:1;min-height:2.4rem;border-radius:.8rem;font-family:var(--f-titoli);font-weight:800;font-size:.95rem;color:var(--ink2)}
.seg-ctrl button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--bord2)}
.tog{position:relative;width:3.2rem;height:1.9rem;border-radius:99px;background:var(--track);border:2px solid var(--bord);flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .2s}
.tog.on{background:var(--verde);border-color:var(--verde-d)}
.tog.on::after{transform:translateX(1.3rem)}

/* ---------- barra delle schede ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:.25rem;padding:.4rem .5rem calc(.5rem + env(safe-area-inset-bottom));
  background:var(--tab);border-top:2px solid var(--bord);max-width:30rem;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-height:3.4rem;font-family:var(--f-titoli);font-weight:800;
  font-size:.8rem;color:var(--ink2);position:relative}
.tab .ii{width:3.3rem;height:2.1rem;border-radius:.75rem;display:grid;place-items:center;transition:background .15s}
.tab.on{color:var(--ink)}
.tab.on .ii{background:var(--viola);color:#fff;box-shadow:0 3px 0 var(--viola-d)}
.tab .pip{position:absolute;top:0;left:calc(50% + .6rem);min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:99px;background:var(--rosso);
  color:#fff;font-size:.68rem;font-weight:900;display:grid;place-items:center;border:2px solid var(--tab);font-family:var(--f-corpo)}

/* ---------- fogli, pagine, conferme ---------- */
.velo{position:fixed;inset:0;z-index:50;background:var(--vel);opacity:0;transition:opacity .2s}
.velo.on{opacity:1}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:30rem;margin:0 auto;background:var(--bg);border-radius:1.6rem 1.6rem 0 0;
  padding:.5rem 1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;overflow-y:auto;transform:translateY(105%);
  transition:transform .26s cubic-bezier(.2,.8,.3,1);box-shadow:0 -10px 30px rgba(0,0,0,.18);overscroll-behavior:contain}
.foglio.on{transform:none}
.foglio .maniglia{width:2.6rem;height:.35rem;border-radius:99px;background:var(--bord2);margin:.2rem auto .8rem}
.foglio h3{font-size:1.4rem;margin-bottom:.35rem}
.foglio .azioni{display:flex;gap:.6rem;margin-top:1rem}
.foglio .azioni .btn{flex:1}
.pagina{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.3,1);
  overscroll-behavior:contain}
.pagina.on{transform:none}
.pagina .dentro{max-width:30rem;margin:0 auto;padding:0 1rem calc(2rem + env(safe-area-inset-bottom))}
.p-testa{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.5rem;padding:calc(.6rem + env(safe-area-inset-top)) 0 .6rem;
  background:linear-gradient(var(--bg) 75%,transparent)}
.p-testa h2{margin:0;flex:1;font-size:1.45rem}
.toast{position:fixed;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,1.5rem);opacity:0;
  max-width:calc(100% - 2rem);width:max-content;display:flex;align-items:center;gap:.75rem;padding:.7rem .7rem .7rem 1rem;border-radius:1rem;
  background:#1D2140;color:#fff;font-weight:800;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .2s,opacity .2s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{font-family:var(--f-titoli);font-weight:800;color:#FFC94D;padding:.3rem .5rem;flex:none}
.sync{position:fixed;top:calc(.4rem + env(safe-area-inset-top));left:50%;transform:translate(-50%,-150%);z-index:60;padding:.3rem .8rem;border-radius:99px;
  background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:800;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none}
.sync.on{transform:translate(-50%,0);opacity:1}
.sync.ko{background:var(--rosso);color:#fff}

/* ---------- gate: chi sei ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;text-align:center}
.gate h1{font-family:var(--f-titoli);font-weight:800;font-size:2.4rem;line-height:1;margin:1rem 0 .3rem}
.gate p{color:var(--ink2);font-weight:700;margin-bottom:1.6rem}
.profili{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;width:100%;max-width:22rem}
.profilo{background:var(--card);border:2px solid var(--bord);border-radius:1.4rem;box-shadow:var(--ombra);padding:1rem .5rem;display:flex;flex-direction:column;
  align-items:center;gap:.5rem;font-family:var(--f-titoli);font-weight:800;font-size:1.15rem}
.profilo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bord)}
.profilo small{font-family:var(--f-corpo);font-size:.8rem;color:var(--ink2);font-weight:700;margin-top:-.4rem}
.logo{width:6rem;height:6rem;display:block}

/* ---------- podio e classifica ---------- */
.podio{display:flex;align-items:flex-end;gap:.5rem}
.pd{flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:0}
.pd .nm{font-weight:800;font-size:.875rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .bl{width:100%;border-radius:1rem 1rem .5rem .5rem;display:flex;flex-direction:column;align-items:center;padding-top:.45rem;
  background:var(--card);border:2px solid var(--bord);box-shadow:var(--ombra);font-family:var(--f-titoli);font-weight:800}
.pd .bl small{font-size:.75rem;opacity:.75}
.pd .bl b{font-size:1.2rem}
.pd.p1 .bl{background:var(--oro);border-color:var(--oro-d);box-shadow:0 4px 0 var(--oro-d);color:var(--oro-ink)}

/* ---------- turni a griglia ---------- */
.griglia{display:grid;grid-template-columns:4.2rem repeat(7,1fr);gap:.3rem;align-items:center}
.griglia .gh{font-size:.72rem;font-weight:900;color:var(--ink2);text-align:center;text-transform:uppercase}
.griglia .gh.oggi{color:var(--viola)}
.griglia .gl{font-size:.8rem;font-weight:800}
.cella{aspect-ratio:1;border-radius:.65rem;display:grid;place-items:center;font-family:var(--f-titoli);font-weight:800;font-size:.75rem;color:#fff;
  background:var(--c);opacity:.9;position:relative;min-width:0}
.cella.chiaro{color:#1D2140}
.cella.fatta::after{content:"✓";position:absolute;right:-.2rem;bottom:-.25rem;width:1rem;height:1rem;border-radius:50%;background:var(--verde);color:#fff;
  font-size:.65rem;display:grid;place-items:center;border:2px solid var(--card)}
.cella.oggi{box-shadow:0 0 0 3px var(--viola)}
.cella.via{background:var(--track)!important;color:var(--ink3)}

/* ---------- calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.cal .dh{font-size:.7rem;font-weight:900;color:var(--ink2);text-align:center;text-transform:uppercase;padding-bottom:.2rem}
.cal .dd{aspect-ratio:1;border-radius:.7rem;background:var(--card);border:2px solid var(--bord);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.15rem;font-weight:800;font-size:.85rem;min-width:0}
.cal .dd.off{visibility:hidden}
.cal .dd.oggi{border-color:var(--viola);color:var(--viola)}
.cal .dd.sel{background:var(--viola);border-color:var(--viola);color:#fff}
.cal .pal{display:flex;gap:2px}
.cal .pal i{width:.38rem;height:.38rem;border-radius:50%;background:var(--c)}

/* ---------- tavolozza ---------- */
.tavolozza{display:grid;grid-template-columns:repeat(5,1fr);gap:.55rem}
.colore{aspect-ratio:1;border-radius:.9rem;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.18);display:grid;place-items:center;
  font-family:var(--f-titoli);font-weight:800;font-size:.75rem;color:#fff;position:relative}
.colore.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.colore:disabled{opacity:.35}

/* ---------- rito della domenica ---------- */
.rito{position:fixed;inset:0;z-index:45;overflow-y:auto;overflow-x:hidden;color:#fff;background:radial-gradient(circle at 50% 36%,#2C2470 0%,#151838 70%);
  opacity:0;transition:opacity .25s}
.rito.on{opacity:1}
:root[data-tema="chiaro"] .rito{color:var(--ink);background:radial-gradient(circle at 50% 36%,#FFFFFF 0%,#E3DEFF 72%)}
@media (prefers-color-scheme:light){:root:not([data-tema="scuro"]) .rito{color:var(--ink);background:radial-gradient(circle at 50% 36%,#FFFFFF 0%,#E3DEFF 72%)}}
.rito .dentro{max-width:30rem;margin:0 auto;padding:calc(1rem + env(safe-area-inset-top)) 1.1rem calc(1.5rem + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%}
.rito .chiudi{align-self:flex-end}

<script>
/* =====================================================================

/* ==================== LA RUOTA PERSONALE ====================
