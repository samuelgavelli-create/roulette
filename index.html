<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D241E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roulette">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roulette di Casa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D241E'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='%23D9A441' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23D9A441'/%3E%3Cpath d='M32 6l5 8H27z' fill='%23D9A441'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D241E'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='%23D9A441' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23D9A441'/%3E%3Cpath d='M32 6l5 8H27z' fill='%23D9A441'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#123028; --felt-2:#081A15; --line:#1E4438; --line-2:#2C5C4C;
  --paper:#F3EDDF; --paper-2:#E4DBC5; --ink:#1A1815; --ink-2:#6A6357;
  --gold:#D9A441; --gold-d:#9E7420; --rosso:#C2412D; --verde:#7ED0B4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{background:var(--felt-2);color:var(--paper);font-family:'Archivo',system-ui,sans-serif;
  line-height:1.5;min-height:100vh;overflow-x:hidden;}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%,#1B4438 0%,#123028 42%,#081A15 100%);}
#bg::after{content:'';position:absolute;inset:-40%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(217,164,65,.055) 12%,transparent 26%,transparent 60%,rgba(217,164,65,.04) 72%,transparent 88%);
  animation:spin 44s linear infinite;}
#bg::before{content:'';position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle,rgba(255,255,255,.045) 1px,transparent 1.3px);
  background-size:22px 22px;}
@keyframes spin{to{transform:rotate(360deg);}}
.mono{font-family:'DM Mono',monospace;}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px 80px;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ===== GATE ===== */
#gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;
  padding:24px 18px;transition:opacity .45s,transform .45s;}
#gate.via{opacity:0;pointer-events:none;}
#gate.zoom{transition:opacity .5s ease .16s,transform .62s cubic-bezier(.5,0,.32,1);}
.prof.scelto{z-index:3;animation:none!important;
  transition:transform .62s cubic-bezier(.5,0,.32,1),box-shadow .4s;
  box-shadow:0 0 0 2px var(--gold),0 18px 50px rgba(0,0,0,.55);}
.prof.scelto .gettone{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform:scale(1.14);}
.prof.spento{transition:opacity .34s,transform .34s;opacity:0;transform:scale(.86);animation:none!important;}
.gate-in.sfuma{transition:opacity .34s;}
.gate-in.sfuma .kick,.gate-in.sfuma h1,.gate-in.sfuma .sub{opacity:0;transition:opacity .3s;}
.gate-in{position:relative;z-index:1;max-width:440px;margin:0 auto;width:100%;}
.kick{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);margin:0 0 10px;text-align:center;animation:up .6s both;}
.gate-in h1{font-weight:900;font-size:clamp(32px,10.5vw,46px);line-height:.9;margin:0 0 8px;
  text-transform:uppercase;letter-spacing:-.025em;text-align:center;animation:up .6s .06s both;}
.gate-in h1 em{font-style:normal;color:var(--gold);text-shadow:0 0 24px rgba(217,164,65,.4);}
.gate-in .sub{text-align:center;font-size:13px;color:#9FB5AB;margin:0 0 26px;animation:up .6s .12s both;}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.profili{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.prof{position:relative;border:1px solid var(--line-2);border-radius:16px;padding:16px 10px 13px;
  background:rgba(255,255,255,.035);cursor:pointer;text-align:center;overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.4);animation:pop .5s both;}
@keyframes pop{from{opacity:0;transform:translateY(22px) rotate(-2deg) scale(.9);}to{opacity:1;transform:none;}}
.prof:active{transform:scale(.94);}
.prof .glow{position:absolute;inset:-30% -30% auto;height:70%;filter:blur(28px);opacity:.55;}
.gettone{position:relative;width:58px;height:58px;margin:0 auto 9px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;color:#fff;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.4);}
.gettone::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.22);animation:spin 18s linear infinite;}
.prof .pn{font-weight:600;font-size:15px;position:relative;}
.prof .pr{font-family:'DM Mono',monospace;font-size:9.5px;color:#8FA79C;letter-spacing:.08em;
  text-transform:uppercase;margin-top:2px;position:relative;}

/* ===== BARRA ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:11px 14px;margin:0 -14px;background:rgba(8,26,21,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);}
.tb-av{width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:transform .18s cubic-bezier(.2,.9,.3,1.4);
  font-weight:900;font-size:12px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);}
.tb-txt{line-height:1.15;min-width:0;}
.tb-txt b{font-size:14px;font-weight:600;display:block;}
.tb-txt span{font-family:'DM Mono',monospace;font-size:10px;color:#8FA79C;letter-spacing:.05em;}
.tb-btn{margin-left:auto;width:40px;height:40px;border-radius:11px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.04);color:var(--paper);cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:4px;position:relative;}
.tb-btn i{display:block;width:16px;height:1.6px;background:var(--paper);border-radius:2px;transition:.25s;}
.tb-btn.open i:nth-child(1){transform:translateY(5.6px) rotate(45deg);}
.tb-btn.open i:nth-child(2){opacity:0;}
.tb-btn.open i:nth-child(3){transform:translateY(-5.6px) rotate(-45deg);}
.tb-btn .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:var(--rosso);border:2px solid #081A15;}
#menu{position:sticky;top:57px;z-index:29;margin:0 -14px;overflow:hidden;max-height:0;
  transition:max-height .38s cubic-bezier(.2,.8,.2,1);background:rgba(10,30,24,.97);
  backdrop-filter:blur(14px);border-bottom:0 solid var(--line);}
#menu.open{max-height:520px;border-bottom-width:1px;}
.mi{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:14.5px;
  opacity:0;transform:translateX(-14px);transition:.3s;}
#menu.open .mi{opacity:1;transform:none;}
#menu.open .mi:nth-child(1){transition-delay:.04s}#menu.open .mi:nth-child(2){transition-delay:.08s}
#menu.open .mi:nth-child(3){transition-delay:.12s}#menu.open .mi:nth-child(4){transition-delay:.16s}
#menu.open .mi:nth-child(5){transition-delay:.20s}#menu.open .mi:nth-child(6){transition-delay:.24s}
#menu.open .mi:nth-child(7){transition-delay:.28s}#menu.open .mi:nth-child(8){transition-delay:.32s}
.mi.att{background:rgba(217,164,65,.1);color:var(--gold);}
.mi svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.mi .bd{margin-left:auto;font-family:'DM Mono',monospace;font-size:10.5px;
  background:var(--gold);color:#2A1D05;padding:1px 7px;border-radius:20px;}
.mi .bd.rosso{background:var(--rosso);color:#FFE9E4;}

/* ===== VISTE ===== */
.view{animation:vin .4s cubic-bezier(.2,.8,.3,1) both;padding-top:16px;}
@keyframes vin{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
h2{font-weight:900;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  margin:0 0 11px;display:flex;align-items:center;gap:9px;}
h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}
.pan{border:1px solid var(--line);border-radius:15px;padding:14px;background:rgba(255,255,255,.032);}
.sez{margin-bottom:22px;}
.vuoto{text-align:center;font-size:13px;color:#7B9188;padding:20px 0;}
.p{margin:0 0 11px;font-size:13px;color:#C3D3CB;}
.debug{border:1px dashed var(--gold-d);border-radius:12px;padding:10px 12px;margin-bottom:16px;
  background:rgba(217,164,65,.07);font-size:12px;color:#E7D3A6;display:flex;gap:10px;align-items:center;}
.debug b{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold-d);border-radius:5px;padding:3px 6px;flex:none;}

/* ===== ROULETTE ===== */
.ruota{width:126px;height:126px;margin:2px auto 16px;position:relative;}
.disco{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(#14352C 0 30deg,#0E241D 30deg 60deg);
  box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 0 0 5px #D9A441,inset 0 0 30px rgba(217,164,65,.25);
  animation:spin 26s linear infinite;}
.disco::before{content:'';position:absolute;inset:16px;border-radius:50%;
  border:1.5px dashed rgba(217,164,65,.45);}
.disco::after{content:'';position:absolute;inset:44%;border-radius:50%;background:var(--gold);
  box-shadow:0 0 14px rgba(217,164,65,.7);}
.ruota .pin{position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid var(--gold);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));z-index:2;}
.ruota.gira .disco{animation:spin .5s linear infinite;}
.slot{border:2px dashed var(--line-2);border-radius:14px;padding:12px 13px;margin-bottom:10px;
  background:rgba(255,255,255,.02);display:flex;gap:12px;align-items:center;min-height:70px;
  transition:border-color .3s,background .3s;}
.slot .sk{width:28px;height:28px;border-radius:9px;border:2px dashed #35604F;flex:none;}
.slot .s1{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7B9188;margin-bottom:3px;}
.slot .s2{font-size:14.5px;font-weight:500;color:#55695F;line-height:1.25;}
.slot.gira{border-style:solid;border-color:rgba(217,164,65,.5);background:rgba(217,164,65,.05);}
.slot.gira .s2{color:#B9C9C0;}
.slot.fermo{border-color:var(--gold);background:rgba(217,164,65,.1);}
.slot.fermo .s2{color:var(--paper);}
.slot.fermo .sk{border-style:solid;border-color:var(--gold);background:rgba(217,164,65,.25);}

/* ===== CARD ===== */
.mcard{position:relative;background:var(--paper);color:var(--ink);border-radius:15px;margin-bottom:12px;
  overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.32);
  animation:flip .6s cubic-bezier(.25,.9,.3,1.1) both;transform-origin:50% 100%;}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(-70deg) translateY(24px);}
  to{opacity:1;transform:perspective(900px) rotateX(0) translateY(0);}}
.mtop{display:flex;align-items:center;gap:7px;padding:8px 13px;background:var(--paper-2);
  border-bottom:1px solid #D4C9AF;flex-wrap:wrap;}
.liv{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;font-weight:500;}
.liv-facile{background:#D6E7D2;color:#2F5029;}
.liv-media{background:#F3E1BF;color:#77571A;}
.liv-difficile{background:#F0D2CB;color:#8A2E20;}
.liv-mensile{background:#2A1D05;color:var(--gold);}
.liv-spazzatura{background:#1A1815;color:var(--verde);}
.liv-flash{background:var(--rosso);color:#FFE9E4;}
.tagx{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--rosso);border:1px solid #E0B7AF;padding:2px 6px;border-radius:4px;}
.quota{margin-left:auto;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;}
.mbody{display:flex;gap:12px;padding:14px 13px;align-items:flex-start;}
.chk{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid #C0B69E;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s cubic-bezier(.2,.9,.3,1.5);}
.chk svg{width:17px;height:17px;stroke:var(--paper);fill:none;stroke-width:3.4;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s .05s;}
.chk.on{background:var(--ink);border-color:var(--ink);transform:scale(1.06);}
.chk.on svg{stroke-dashoffset:0;}
.mtit{font-size:15px;font-weight:500;line-height:1.32;}
.mtit.done{text-decoration:line-through;color:#9A9285;}
.mnote{font-size:12px;color:var(--ink-2);margin-top:3px;}
.mfoot{display:flex;align-items:center;gap:8px;padding:8px 13px;border-top:1px dashed #D4C9AF;
  font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-2);}
.mfoot .cd{margin-left:auto;font-weight:500;color:var(--ink);}
.mfoot .cd.urg{color:var(--rosso);animation:puls 1.1s ease-in-out infinite;}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.42}}
.mcard.flash{box-shadow:0 0 0 2px rgba(194,65,45,.7),0 8px 22px rgba(0,0,0,.32);}
.mcard.rubabile{box-shadow:0 0 0 2px var(--gold),0 10px 26px rgba(217,164,65,.28);}
.btn-ruba{margin-left:auto;padding:6px 12px;border-radius:8px;border:none;background:var(--ink);
  color:var(--gold);font-weight:600;font-size:12px;cursor:pointer;flex:none;}
.btn-ruba:active{transform:scale(.95);}
.btn-x{margin-left:auto;padding:5px 10px;border-radius:8px;border:1px solid #D4C9AF;
  background:transparent;color:var(--ink-2);font-size:11.5px;cursor:pointer;flex:none;}
.lock{position:absolute;inset:0;background:rgba(14,32,26,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--paper);cursor:pointer;}
.lock .chain{position:absolute;left:-8%;width:116%;height:26px;opacity:.72;}
.lock .chain.a{top:26%;transform:rotate(-7deg);}
.lock .chain.b{top:60%;transform:rotate(5deg);}
.lock .pad{width:42px;height:42px;position:relative;z-index:2;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
.lock .lt{position:relative;z-index:2;font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:center;padding:0 18px;}
.mcard.shake{animation:shake .5s;}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ===== RIGHE / CONTROLLI ===== */
.riga{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px;}
.riga:last-child{border-bottom:none;}
.pall{width:9px;height:9px;border-radius:50%;flex:none;}
.riga .rt{flex:1;min-width:0;}
.riga .rt b{font-weight:500;display:block;font-size:13.5px;}
.riga .rt span{font-family:'DM Mono',monospace;font-size:10px;color:#8FA79C;}
.spunta{color:var(--verde);font-size:15px;}
.mini{width:26px;height:26px;flex:none;border-radius:8px;border:1.5px solid var(--line-2);
  background:transparent;color:#8FA79C;cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;}
.mini.on{background:var(--verde);border-color:var(--verde);color:#0E2019;}
.btn{width:100%;padding:17px;border:none;border-radius:13px;cursor:pointer;background:var(--gold);
  color:#2A1D05;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.05em;
  box-shadow:0 4px 0 var(--gold-d);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d);}
.btn:disabled{opacity:.7;}
.btn-r{background:var(--rosso);color:#FFF1EE;box-shadow:0 4px 0 #8A2E20;}
.btn-o{width:100%;padding:14px;border-radius:11px;cursor:pointer;background:transparent;
  border:1.5px solid var(--rosso);color:#F0A99C;font-weight:600;font-size:14px;}
.btn-g{width:100%;padding:12px;border-radius:10px;cursor:pointer;background:transparent;
  border:1px solid var(--line-2);color:#A9BCB2;font-size:13px;margin-top:8px;}
.btn-s{padding:9px 13px;border-radius:9px;cursor:pointer;background:var(--gold);border:none;
  color:#2A1D05;font-weight:600;font-size:12.5px;flex:none;}
.btn-g:active,.btn-o:active,.btn-s:active{transform:scale(.98);}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.05);color:var(--paper);font-family:'Archivo',sans-serif;
  font-size:14.5px;margin-bottom:8px;}
.inp::placeholder{color:#6E8579;}
.row{display:flex;gap:8px;align-items:center;}
.chip{display:flex;gap:7px;margin-bottom:10px;}
.chip button{flex:1;padding:11px 4px;border-radius:11px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.03);color:#A9BCB2;font-size:13px;cursor:pointer;}
.chip button.on{color:#0E2019;font-weight:600;border-color:transparent;}

/* ===== CALENDARIO ===== */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
.cal-h b{font-weight:900;font-size:18px;text-transform:capitalize;}
.nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:transparent;
  color:var(--paper);cursor:pointer;font-size:17px;line-height:1;}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
.dows span{text-align:center;font-family:'DM Mono',monospace;font-size:9px;color:#7B9188;
  text-transform:uppercase;letter-spacing:.06em;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day{aspect-ratio:1;border-radius:9px;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;
  color:var(--paper);animation:dpop .3s both;}
@keyframes dpop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:none;}}
.day.off{opacity:.2;pointer-events:none;}
.day.oggi{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.day.rit{background:rgba(126,208,180,.12);}
.day:active{background:rgba(255,255,255,.1);}
.dots{display:flex;gap:2.5px;height:5px;align-items:center;}
.dots i{width:4.5px;height:4.5px;border-radius:50%;display:block;}
.lg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;
  font-family:'DM Mono',monospace;font-size:10px;color:#8FA79C;}
.lg span{display:flex;align-items:center;gap:5px;}
.lg i{width:8px;height:8px;border-radius:50%;display:block;}

/* ===== SHEET ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none;}
#sheet.on{display:block;}
#sheet .bk{position:absolute;inset:0;background:rgba(4,14,11,.62);backdrop-filter:blur(3px);}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;
  background:#0E2A22;border-top:1px solid var(--line-2);border-radius:20px 20px 0 0;
  padding:14px 16px calc(28px + env(safe-area-inset-bottom));

/* ==================== SPAZZATURA AUTOMATICA ==================== */
const settIdx=ms=>Math.round((lunedi(ms)-EPOCA)/(7*864e5));
function attivo(tp,ms){

function slotsSettimana(mon){

/* ==================== SERVIZI DI CASA (turni automatici) ==================== */
/* Ogni settimana i due servizi si spezzano in due blocchi: lun-gio e ven-dom.
   Quattro blocchi, quattro persone, una a testa. La rotazione gira da sola. */
function bloccoKey(mon,sv,bl){ return iso(new Date(mon+bl.gg[0]*864e5))+'|'+sv.k+'|'+bl.k; }
function blocchiSett(ms){
  const mon=lunedi(ms), w=settIdx(ms), out=[];
  SERVIZI.forEach((sv,si)=>BLOCCHI.forEach((bl,bi)=>{
    const slot=si*BLOCCHI.length+bi;
    const base=G[(((w+slot)%G.length)+G.length)%G.length].n;
    const bk=bloccoKey(mon,sv,bl), ov=(S.servTurni||{})[bk]||{};
    const gg=bl.gg.map(off=>{ const d=new Date(mon); d.setDate(d.getDate()+off); return iso(d); });
    out.push({bk,sv,bl,base,chi:ov.chi||base,exchi:ov.exchi||null,mon,gg,
      dal:gg[0],al:gg[gg.length-1]});
  }));
  return out;
}
function serviziSett(ms){
  const out=[];
  blocchiSett(ms).forEach(b=>b.gg.forEach(gk=>{
    const k=gk+'|'+b.sv.k, st=(S.serv||{})[k]||{};
    const t=new Date(gk+'T12:00'); t.setDate(t.getDate()+1); t.setHours(10,0,0,0);
    out.push({k,bk:b.bk,sv:b.sv,bl:b.bl,giorno:gk,ts:t.getTime(),
      chi:b.chi,exchi:b.exchi,fatta:!!st.fatta});
  }));
  return out.sort((a,b)=>a.giorno<b.giorno?-1:a.giorno>b.giorno?1:0);
}
function serviziGiorno(k){ return serviziSett(new Date(k+'T12:00').getTime()).filter(t=>t.giorno===k); }
function servizioK(k){ return serviziGiorno(k.split('|')[0]).find(t=>t.k===k); }
function mioBlocco(ms){ return blocchiSett(ms||Date.now()).find(b=>b.chi===io)||null; }
function chiudiServizi(){

      if(t.ts<Date.now()&&t.ts>=S.servDa&&!S.servChiuse[t.k]){

/* ==================== PROBABILITÀ ==================== */
/* Chiave 'm:Titolo' per la singola missione, 'g:gruppo' per tutto il gruppo.
   La singola vince sul gruppo. Se non c'è niente, è tutto equo. */
const eleggibili=m=>G.map(g=>g.n).filter(n=>!m.s||m.s.includes(n));
function pesiSalvati(m){
  return (S.pesi||{})['m:'+m.t] || (S.pesi||{})['g:'+grpDi(m)] || null;
}
function pesiDi(m){
  const el=eleggibili(m), raw=pesiSalvati(m), out={};
  if(!raw){ el.forEach(n=>out[n]=100/el.length); return out; }
  const tot=el.reduce((a,n)=>a+Math.max(0,+raw[n]||0),0);
  if(tot<=0){ el.forEach(n=>out[n]=100/el.length); return out; }
  el.forEach(n=>out[n]=Math.max(0,+raw[n]||0)/tot*100);
  return out;
}
const pesoToccato=key=>!!(S.pesi||{})[key];
/* arrotonda a interi che fanno esattamente 100 */
function percInt(p){
  const ks=Object.keys(p), gr=ks.map(k=>({k,v:p[k],f:Math.floor(p[k])}));
  let r=100-gr.reduce((a,x)=>a+x.f,0);
  gr.sort((a,b)=>(b.v-b.f)-(a.v-a.f));
  const out={}; gr.forEach((x,i)=>out[x.k]=x.f+(i<r?1:0));
  return out;
}
/* muove la percentuale di una persona e ridistribuisce il resto in proporzione */
function spostaPeso(key,m,chi,delta){
  const el=eleggibili(m);
  if(!S.pesi[key]){ S.pesi[key]={}; el.forEach(n=>S.pesi[key][n]=100/el.length); }
  const p={}; el.forEach(n=>p[n]=Math.max(0,+S.pesi[key][n]||0));
  const tot=el.reduce((a,n)=>a+p[n],0)||1;
  el.forEach(n=>p[n]=p[n]/tot*100);
  const nuovo=Math.min(100,Math.max(0,p[chi]+delta));
  const resto=100-nuovo, altri=el.filter(n=>n!==chi);
  const sa=altri.reduce((a,n)=>a+p[n],0);
  altri.forEach(n=>p[n]=sa>0?p[n]/sa*resto:resto/altri.length);
  p[chi]=nuovo; S.pesi[key]=p;
}
function pesa(coppie){
  const tot=coppie.reduce((a,x)=>a+x[1],0);
  if(tot<=0) return coppie[Math.floor(Math.random()*coppie.length)][0];
  let r=Math.random()*tot;
  for(const c of coppie){ r-=c[1]; if(r<=0) return c[0]; }
  return coppie[coppie.length-1][0];
}

/* ==================== ESTRAZIONE ==================== */
/* sceglie le missioni del livello: prima gli arretrati, poi il sacco.
   Al massimo due ristrette per livello, tante quante le persone che possono riceverle. */
function scegliMissioni(key){
  const pool=SACCO[key], arr=S.arretrati.filter(a=>a.liv===key);
  const sel=[], usati=new Set(); let ristretti=0;
  const prendi=c=>{
    if(!c||usati.has(c.t)||sel.length>=G.length) return;
    if(c.s&&ristretti>=ARMADIO.length) return;
    usati.add(c.t); if(c.s) ristretti++; sel.push(c);
  };
  mix(arr).forEach(a=>prendi({t:a.t,n:a.n,s:a.s,g:grpDi(MISS(a.t)),
    arr:true,volte:a.volte||1,prec:a.chi}));
  mix(pool).forEach(m=>prendi({...m,arr:false,volte:0,prec:null}));
  return sel;
}
/* assegna le missioni alle persone rispettando le percentuali.
   Parte dalle più vincolate, così l'armadio non resta mai senza destinatario. */
function assegna(sel){
  for(let t=0;t<300;t++){
    const liberi=G.map(g=>g.n), res=[];
    const ord=mix(sel).sort((a,b)=>eleggibili(a).length-eleggibili(b).length);
    let ok=true;
    for(const m of ord){
      const cand=liberi.filter(n=>eleggibili(m).includes(n));
      if(!cand.length){ ok=false; break; }
      const p=pesiDi(m);
      const chi=pesa(cand.map(n=>[n,((p[n]||0)+0.001)*(m.prec===n?0.15:1)]));
      res.push({m,chi}); liberi.splice(liberi.indexOf(chi),1);
    }
    if(ok) return res;
  }
  return sel.map((m,i)=>({m,chi:G[i%G.length].n}));
}
function estrai(){
  const w=S.settimana, mens=w%4===0, out=[];
  ['facile','media','difficile'].forEach(liv=>{
    const key=(liv==='difficile'&&mens)?'mensile':liv;
    assegna(scegliMissioni(key)).forEach(({m,chi})=>{
      out.push({id:'m'+Math.random().toString(36).slice(2,9),chi,liv:key,t:m.t,n:m.n||'',
        s:m.s||null,g:grpDi(m),arr:!!m.arr,volte:m.volte||0,fatta:false,ruba:null,exchi:null,
        scambiata:false,scad:scadenzaDi(key)});
    });
  });
  S.missioni=out; S.estratto=true; S.rivelato={};
  S.arretrati=S.arretrati.filter(a=>!out.some(o=>o.t===a.t));
  S.scambi=(S.scambi||[]).filter(x=>x.tipo==='servizio');
  riportaFlash();
  log('estrazione',io,'Ruota girata · settimana #'+S.settimana);
}
function nuovaSettimana(){
  S.inizio=S.inizio?S.inizio+7*864e5:lunedi(Date.now());
  S.settimana++; S.missioni=[]; S.estratto=false; S.rivelato={};
}
function chiudi(){
  let inc=0;
  S.missioni.forEach(m=>{
    if(m.fatta||bloccato(m.liv,S.settimana)) return;
    S.debiti[m.chi]=(S.debiti[m.chi]||0)+quotaDi(m); inc+=quotaDi(m);
    log('saltata',m.chi,m.t,quotaDi(m),null,m.id);
    const a=S.arretrati.find(x=>x.t===m.t);
    if(a){a.volte++;a.chi=m.chi;}
    else S.arretrati.push({t:m.t,n:m.n,liv:m.liv,s:m.s,chi:m.chi,volte:1});
  });
  if(S.estratto){ S.storico.unshift({w:S.settimana,inc,q:Date.now()}); S.storico=S.storico.slice(0,12); }
  nuovaSettimana();
  return inc;
}
function rollover(){ let n=0; while(Date.now()>fineSett()&&n<60){ chiudi(); n++; } return n; }

/* entrata: la ruota si avvicina verso il gettone che hai toccato */
function entra(nome,card){
  io=nome;
  try{ localStorage.setItem('casa-io',io); }catch(e){}
  const g=document.getElementById('gate');
  const lento=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(card&&!lento){
    const r=card.getBoundingClientRect();
    g.style.transformOrigin=((r.left+r.width/2)/innerWidth*100).toFixed(1)+'% '+
                            ((r.top+r.height/2)/innerHeight*100).toFixed(1)+'%';
    document.querySelectorAll('.prof').forEach(p=>p.classList.add(p===card?'scelto':'spento'));
    const gi=document.querySelector('.gate-in'); if(gi) gi.classList.add('sfuma');
    requestAnimationFrame(()=>{ g.classList.add('zoom');
      g.style.transform='scale(2.9)'; g.style.opacity='0'; });
  }else g.classList.add('via');
  setTimeout(()=>{ g.style.display='none';
    document.getElementById('app').style.display=''; disegna(); }, lento?300:600);
}
document.querySelectorAll('[data-p]').forEach(el=>{
  el.onclick=()=>entra(el.dataset.p,el);
});

    '<div class="dsub">Tocca un nome per passare a quel profilo</div>'+

    (pushPronte()?'<button class="btn-o" id="shPush" style="margin-top:12px">'+
      'Attiva le notifiche su questo telefono</button>':'')+
    '<button class="btn-g" id="shClose" style="margin-top:8px">Chiudi</button>';
  document.getElementById('sheet').classList.add('on');
  document.getElementById('shClose').onclick=chiudiSheet;

const VOCI=[['missioni','Le mie missioni'],['servizi','Servizi di casa'],['flash','Missioni flash'],
  ['lista','Lista della spesa'],['calendario','Calendario'],['spazzatura','Spazzatura'],
  ['tesoretto','Tesoretto'],['probabilita','Probabilità'],
  ['regole','Regolamento'],['esci','Cambia profilo']];
function menu(){
  const rub=S.missioni.filter(m=>m.chi!==io&&rubabile(m)).length;
  const fl=flashMie().length;
  const ls=S.spesa.filter(i=>!i.presa).length;
  const sc=scambiPerMe().length;
  const sv=serviziSett(Date.now()).filter(t=>t.chi===io&&!t.fatta&&t.ts>Date.now()).length;
  document.getElementById('menu').innerHTML=VOCI.map(v=>{
    let bd='';
    if(v[0]==='missioni'&&rub) bd='<span class="bd">'+rub+' da rubare</span>';
    if(v[0]==='flash'&&fl) bd='<span class="bd rosso">'+fl+' per te</span>';
    if(v[0]==='lista'&&ls) bd='<span class="bd">'+ls+' in lista</span>';
    if(v[0]==='servizi'&&sv) bd='<span class="bd">'+sv+' turni tuoi</span>';
    if(v[0]==='missioni'&&sc) bd='<span class="bd rosso">'+sc+' scambi</span>';
    return '<div class="mi '+(vista===v[0]?'att':'')+'" data-v="'+v[0]+'">'+
      '<svg viewBox="0 0 24 24">'+ICONE[v[0]]+'</svg>'+v[1]+bd+'</div>';
  }).join('');
  document.querySelectorAll('[data-v]').forEach(el=>{
    el.onclick=()=>{ const v=el.dataset.v; chiudiMenu();

function chiudiMenu(){ menuOpen=false;

function disegna(){

function aggiornaTimer(){
  document.querySelectorAll('[data-cd]').forEach(e=>{

/* ---- probabilità ---- */
let PIDX=[], pApri=null, pMiss=null;
function barraPerc(m){
  const p=percInt(pesiDi(m));
  return '<div class="barra">'+Object.keys(p).map(n=>
    '<i style="width:'+p[n]+'%;background:'+COL(n)+'"></i>').join('')+'</div>';
}
function controlliPerc(key,m){
  const p=percInt(pesiDi(m));
  return barraPerc(m)+'<div class="pctrl">'+eleggibili(m).map(n=>{
    const gi=PIDX.push({key,m,chi:n,d:-5})-1, pi=PIDX.push({key,m,chi:n,d:5})-1;
    return '<div class="pline"><span class="pall" style="background:'+COL(n)+'"></span>'+
      '<span class="nm">'+n+'</span>'+
      '<button data-pm="'+gi+'">−</button>'+
      '<span class="vv">'+p[n]+'%</span>'+
      '<button data-pm="'+pi+'">+</button></div>';
  }).join('')+'</div>'+
  (pesoToccato(key)?'<button class="btn-sc" data-pr="'+
    (PIDX.push({key,reset:true})-1)+'" style="margin-top:10px">Torna equa</button>':'');
}
function vProbabilita(){
  PIDX=[];
  const usati=GRUPPI.filter(g=>TUTTE().some(m=>grpDi(m)===g.k));
  let h='<div class="sez"><div class="pan"><p class="p" style="margin:0">Di base ogni missione ha la stessa '+
    'probabilità di capitare a chiunque. Se sposti una percentuale compare la barra coi vostri colori. '+
    'È un peso sull\'estrazione, non una garanzia: ogni livello assegna quattro missioni diverse a '+
    'quattro persone diverse, quindi resta comunque un incastro.</p></div></div>';
  h+='<div class="sez"><h2>Gruppi</h2><div class="pan">';
  usati.forEach(g=>{
    const key='g:'+g.k, esempio=TUTTE().find(m=>grpDi(m)===g.k);
    const n=TUTTE().filter(m=>grpDi(m)===g.k).length;
    const tocc=pesoToccato(key), ap=pApri===g.k;
    const ti=PIDX.push({apri:g.k})-1;
    h+='<div class="prow"><div class="prow-h" data-pa="'+ti+'">'+
      '<span class="pall" style="background:'+(tocc?'#D9A441':'#4A5F58')+'"></span>'+
      '<span class="pt"><b>'+g.nome+'</b><span>'+n+' mission'+(n===1?'e':'i')+'</span></span>'+
      '<span class="stato '+(tocc?'att':'')+'">'+(tocc?'su misura':'equa')+'</span></div>'+
      (tocc&&!ap?barraPerc(esempio):'');
    if(ap){
      h+=controlliPerc(key,esempio);
      h+='<div class="pgrp">Eccezioni su singole missioni</div>';
      TUTTE().filter(m=>grpDi(m)===g.k).forEach(m=>{
        const mk='m:'+m.t, mt=pesoToccato(mk), mo=pMiss===m.t;
        const mi=PIDX.push({apriM:m.t})-1;
        h+='<div class="prow"><div class="prow-h" data-pa="'+mi+'">'+
          '<span class="pt"><b style="font-weight:500;font-size:12.5px">'+m.t+'</b>'+
          '<span>'+LAB[m.liv]+(m.s?' · solo '+m.s.join(' e '):'')+'</span></span>'+
          '<span class="stato '+(mt?'att':'')+'">'+(mt?'eccezione':'segue il gruppo')+'</span></div>'+
          (mt&&!mo?barraPerc(m):'')+(mo?controlliPerc(mk,m):'')+'</div>';
      });
    }
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

function apriScambio(tipo,rif){
  let h='<div class="grab"></div><h3>Proponi uno scambio</h3>';
  if(tipo==='servizio'){
    const b=blocchiSett(Date.now()), mio=b.find(x=>x.bk===rif);
    if(!mio){ toast('Turno non trovato.'); return; }
    h+='<div class="dsub">Dai via: '+mio.sv.nome+' · '+mio.bl.nome+'</div><div class="pan">'+
      b.filter(x=>x.chi!==io).map(x=>'<div class="riga" data-scpick="'+x.bk+'">'+
        '<span class="pall" style="background:'+COL(x.chi)+'"></span>'+
        '<span class="rt"><b>'+x.sv.nome+'</b><span>'+x.chi+' · '+x.bl.nome+'</span></span>'+
        '<span class="spunta">→</span></div>').join('')+'</div>';
  }else{
    const mio=S.missioni.find(m=>m.id===rif);
    if(!mio){ toast('Missione non trovata.'); return; }
    const cand=S.missioni.filter(m=>m.chi!==io&&!m.fatta&&
      (!m.s||m.s.includes(io))&&(!mio.s||mio.s.includes(m.chi)));
    h+='<div class="dsub">Dai via: '+esc(mio.t)+'</div><div class="pan">'+
      (cand.length?cand.map(m=>'<div class="riga" data-scpick="'+m.id+'">'+
        '<span class="pall" style="background:'+COL(m.chi)+'"></span>'+
        '<span class="rt"><b>'+esc(m.t)+'</b><span>'+m.chi+' · '+LAB[m.liv]+' · '+eur(quotaDi(m))+'</span></span>'+
        '<span class="spunta">→</span></div>').join('')
       :'<div class="vuoto">Nessuna missione scambiabile. Le missioni dell\'armadio restano fra Samuel e Thomas.</div>')+
      '</div>';
  }
  h+='<button class="btn-g" id="shClose" style="margin-top:12px">Annulla</button>';
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('shClose').onclick=chiudiSheet;
  document.querySelectorAll('#sheetIn [data-scpick]').forEach(el=>{
    el.onclick=async()=>{
      const suo=el.dataset.scpick;
      const a=tipo==='servizio'
        ? (blocchiSett(Date.now()).find(x=>x.bk===suo)||{}).chi
        : (S.missioni.find(m=>m.id===suo)||{}).chi;
      if(!a) return;
      S.scambi.push({id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
        tipo,da:io,a,mio:rif,suo,ts:Date.now(),scad:Date.now()+SCAMBIO_ORE*36e5,stato:'aperto'});
      log('scambio',a,'Scambio proposto da '+io,0);
      await salva(); avvisa(a,'Proposta di scambio',io+' ti propone uno scambio.');
      chiudiSheet(); disegna(); toast('Proposta mandata a '+a+'.');
    };
  });
}

    '<span class="rt"><b>'+x.tp.nome+'</b><span>'+dataBreve(x.giorno)+' · '+x.chi+
    (x.da?' (rubato a '+x.da+')':'')+'</span></span>'+

/* ---- calendario ---- */
function vCalendario(){
  const oggi=new Date();
  if(!calMese) calMese=new Date(oggi.getFullYear(),oggi.getMonth(),1);
  const y=calMese.getFullYear(), mo=calMese.getMonth();
  const off=(new Date(y,mo,1).getDay()+6)%7, gg=new Date(y,mo+1,0).getDate();
  let celle='';
  for(let i=0;i<off;i++) celle+='<div class="day off"></div>';
  for(let d=1;d<=gg;d++){
    const dt=new Date(y,mo,d), k=iso(dt);
    const ev=S.eventi.filter(e=>e.d===k);
    const lg=S.log.filter(l=>l.g===k&&(l.tipo==='fatta'||l.tipo==='rubata'));
    const ri=turniGiorno(k);
    celle+='<div class="day '+(dt.toDateString()===oggi.toDateString()?'oggi':'')+' '+(ri.length?'rit':'')+
      '" data-day="'+k+'" style="animation-delay:'+((off+d)*10)+'ms">'+d+
      '<span class="dots">'+
      lg.slice(0,3).map(l=>'<i style="background:'+COL(l.chi)+'"></i>').join('')+
      ev.slice(0,2).map(()=>'<i style="background:#F3EDDF;opacity:.7"></i>').join('')+
      ri.slice(0,2).map(r=>'<i style="background:'+r.tp.c+';opacity:.55"></i>').join('')+
      '</span></div>';
  }
  const futuri=S.eventi.filter(e=>e.d>=iso(oggi)).sort((a,b)=>a.d<b.d?-1:1).slice(0,6);
  const diario=S.log.filter(l=>l.tipo!=='estrazione').slice(0,8);
  return '<div class="sez"><div class="pan">'+
    '<div class="cal-h"><button class="nav" data-mese="-1">‹</button><b>'+MESI[mo]+' '+y+
    '</b><button class="nav" data-mese="1">›</button></div>'+
    '<div class="dows">'+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>'<span>'+d+'</span>').join('')+'</div>'+
    '<div class="grid">'+celle+'</div>'+
    '<div class="lg"><span><i style="background:#7ED0B4;opacity:.55"></i>ritiro</span>'+
    '<span><i style="background:#F3EDDF;opacity:.7"></i>evento</span>'+
    '<span><i style="background:#C9932F"></i>attività fatta</span></div>'+
    '<p class="p" style="text-align:center;margin:12px 0 0;font-size:11.5px;color:#7B9188">'+
    'Tocca un giorno per vedere bidoni, attività completate ed eventi.</p></div></div>'+
    '<div class="sez"><h2>In arrivo</h2><div class="pan">'+
    (futuri.length?futuri.map(e=>'<div class="riga"><span class="rt"><b>'+e.t+'</b><span>'+
      dataBreve(e.d)+' · '+e.chi+'</span></span>'+
      '<button class="mini" data-delev="'+e.id+'">×</button></div>').join('')
     :'<div class="vuoto">Niente in agenda. Tocca un giorno per segnare qualcosa.</div>')+'</div></div>'+
    '<div class="sez"><h2>Diario di casa</h2><div class="pan">'+
    (diario.length?diario.map(l=>'<div class="riga">'+
      '<span class="pall" style="background:'+COL(l.chi)+'"></span>'+
      '<span class="rt"><b>'+l.testo+'</b><span>'+l.chi+' · '+etichetta(l.tipo)+' · '+
      new Date(l.ts).toLocaleDateString('it-IT')+'</span></span></div>').join('')
     :'<div class="vuoto">Ancora niente. La prima spunta apre il diario.</div>')+'</div></div>';
}
const etichetta=t=>({fatta:'completata',rubata:'rubata',saltata:'saltata',flash:'flash',
  spesa:'spesa comune',versamento:'versamento',estrazione:'estrazione'}[t]||t);

/* ---- sheet giorno ---- */

  const dt=new Date(k+'T12:00');
  const ri=turniGiorno(k);
  const lg=S.log.filter(l=>l.g===k&&l.tipo!=='estrazione');
  const ev=S.eventi.filter(e=>e.d===k);
  const fl=S.flash.filter(f=>iso(f.ts)===k||iso(f.scad)===k);
  let h='<div class="grab"></div><h3>'+DOWL[dt.getDay()]+' '+dt.getDate()+' '+MESI[dt.getMonth()]+'</h3>'+
    '<div class="dsub">Giornata di casa</div>';
  h+='<div class="sez"><h2>Bidoni</h2><div class="pan">'+
    (ri.length?ri.map(x=>'<div class="riga"><span class="pall" style="background:'+x.tp.c+'"></span>'+
      '<span class="rt"><b>'+x.tp.nome+'</b><span>fuori entro le 07:00 · '+x.chi+'</span></span>'+
      '<button class="mini '+(x.fatta?'on':'')+'" data-sp="'+x.k+'">'+(x.fatta?'✓':'')+'</button></div>').join('')
     :'<div class="vuoto">Nessun ritiro in questo giorno.</div>')+'</div></div>';
  const sv=serviziGiorno(k);
  h+='<div class="sez"><h2>Servizi</h2><div class="pan">'+
    (sv.length?sv.map(x=>'<div class="riga"><span class="pall" style="background:'+x.sv.c+'"></span>'+
      '<span class="rt"><b>'+x.sv.nome+'</b><span>'+x.chi+'</span></span>'+
      '<button class="mini '+(x.fatta?'on':'')+'" data-ss="'+x.k+'">'+(x.fatta?'✓':'')+'</button></div>').join('')
     :'<div class="vuoto">Nessun servizio in questo giorno.</div>')+'</div></div>';
  h+='<div class="sez"><h2>Attività</h2><div class="pan">'+
    (lg.length?lg.map(l=>'<div class="riga"><span class="pall" style="background:'+COL(l.chi)+'"></span>'+
      '<span class="rt"><b>'+l.testo+'</b><span>'+l.chi+' · '+etichetta(l.tipo)+'</span></span>'+
      (l.val?'<span class="mono" style="color:#F0A99C">'+eur(l.val)+'</span>':'')+'</div>').join('')
     :'<div class="vuoto">Nessuna attività registrata.</div>')+'</div></div>';
  if(fl.length) h+='<div class="sez"><h2>Flash</h2><div class="pan">'+fl.map(f=>
    '<div class="riga"><span class="pall" style="background:'+COL(f.a)+'"></span>'+
    '<span class="rt"><b>'+f.t+'</b><span>'+f.da+' → '+f.a+' · '+
    (f.fatta?'conclusa':f.chiuso?'scaduta':'in corso')+'</span></span></div>').join('')+'</div></div>';
  h+='<div class="sez"><h2>Eventi</h2><div class="pan">'+
    (ev.length?ev.map(e=>'<div class="riga"><span class="rt"><b>'+e.t+'</b><span>'+e.chi+'</span></span>'+
      '<button class="mini" data-delev="'+e.id+'">×</button></div>').join('')
     :'<div class="vuoto">Niente di segnato.</div>')+
    '<div class="row" style="margin-top:12px"><input class="inp" id="evT" style="margin:0" '+
    'placeholder="Cena, ospiti, compleanno…"><button class="btn-s" data-addev="'+k+'">Aggiungi</button></div>'+
    '</div></div><button class="btn-g" id="shClose" style="margin-top:4px">Chiudi</button>';
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
  attaccaSheet(k);
}
function chiudiSheet(){ document.getElementById('sheet').classList.remove('on'); }
document.getElementById('sheetBk').onclick=chiudiSheet;
function attaccaSheet(k){
  document.getElementById('shClose').onclick=chiudiSheet;
  document.querySelectorAll('#sheetIn [data-sp]').forEach(el=>{
    el.onclick=async()=>{ await toggleSpazz(el.dataset.sp); disegna(); apriGiorno(k); };
  });
  document.querySelectorAll('#sheetIn [data-ss]').forEach(el=>{
    el.onclick=async()=>{ await toggleServ(el.dataset.ss); disegna(); apriGiorno(k); };
  });
  document.querySelectorAll('#sheetIn [data-delev]').forEach(el=>{
    el.onclick=async()=>{ S.eventi=S.eventi.filter(e=>e.id!==el.dataset.delev);
      await salva(); disegna(); apriGiorno(k); };
  });
  const add=document.querySelector('#sheetIn [data-addev]');
  if(add) add.onclick=async()=>{
    const t=document.getElementById('evT').value.trim();
    if(!t){ toast('Scrivi cosa succede quel giorno.'); return; }
    S.eventi.push({id:'e'+Date.now(),d:k,t,chi:io});
    await salva(); disegna(); apriGiorno(k); toast('Evento segnato.');
  };
}

/* ---- obiettivo della cassa ---- */
function panObiettivo(){
  const ob=S.obiettivo;
  if(ob){
    const p=Math.max(0,Math.min(100,Math.round(S.cassa/ob.costo*100)));
    const manca=Math.round(Math.max(0,ob.costo-S.cassa)*100)/100;

/* ==================== AZIONI ==================== */
async function toggleSpazz(k){
  const t=turnoK(k); if(!t) return;
  if(t.fatta){
    delete S.spazz[k];
    S.pendenze=S.pendenze.filter(p=>p.rif!==k);
    S.log=S.log.filter(l=>l.rif!==k||l.tipo==='saltata');
  }else{
    const suo=t.chi===io;
    if(!suo&&!confirm('Il bidone è di '+t.chi+'. Se lo porti fuori tu, '+t.chi+' ti deve '+
      eur(QUOTA.spazzatura/2)+'. Procedo?')) return;
    S.spazz[k]={fatta:true,chi:io,da:suo?null:t.chi,ts:Date.now()};
    if(!suo) S.pendenze.push({id:'p'+Date.now(),da:t.chi,a:io,val:QUOTA.spazzatura/2,
      cosa:'Bidone '+t.tp.nome.toLowerCase(),rif:k,ts:Date.now()});
    log(suo?'fatta':'rubata',io,'Bidone '+t.tp.nome.toLowerCase()+(suo?' fuori':' rubato a '+t.chi),0,t.giorno,k);
    toast(suo?'Bidone fuori. Zero euro in cassa.':'Rubato. '+t.chi+' ti deve '+eur(QUOTA.spazzatura/2)+'.');
  }
  await salva();
}

async function toggleServ(k){
  const t=servizioK(k); if(!t) return;
  if(t.fatta){
    delete S.serv[k];
    S.pendenze=S.pendenze.filter(p=>p.rif!==k);
    S.log=S.log.filter(l=>l.rif!==k||l.tipo==='saltata');
  }else{
    const suo=t.chi===io;
    if(!suo&&!confirm(t.sv.nome+' è di '+t.chi+' quella sera. Se lo fai tu, '+t.chi+
      ' ti deve '+eur(QUOTA.servizio/2)+'. Procedo?')) return;
    S.serv[k]={fatta:true,chi:io,da:suo?null:t.chi,ts:Date.now()};
    if(!suo) S.pendenze.push({id:'p'+Date.now(),da:t.chi,a:io,val:QUOTA.servizio/2,
      cosa:t.sv.nome,rif:k,ts:Date.now()});
    log(suo?'fatta':'rubata',io,t.sv.nome+(suo?'':' al posto di '+t.chi),0,t.giorno,k);
  }
  await salva();
}

      if(!confirm(p.da+' ha pagato '+eur(p.val)+' a '+p.a+'?')) return;
      S.pendenze=S.pendenze.filter(x=>x.id!==p.id);
      await salva(); disegna(); toast('Conto saldato.');
    };
  });
  document.querySelectorAll('#vista [data-lscat]').forEach(el=>{
    el.onclick=()=>{ catSel=el.dataset.lscat; disegna(); };
  });
  const ba=document.getElementById('bAddLs');
  if(ba) ba.onclick=async()=>{
    const t=document.getElementById('lsT').value.trim();
    const n=document.getElementById('lsN').value.trim();
    if(!t){ toast('Scrivi cosa manca.'); return; }
    S.spesa.unshift({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      t,n,cat:catSel,chi:io,ts:Date.now(),presa:false});
    await salva(); disegna(); toast('Aggiunto alla lista.');
  };
  document.querySelectorAll('#vista [data-lspr]').forEach(el=>{
    el.onclick=async()=>{
      const i=S.spesa.find(x=>x.id===el.dataset.lspr); if(!i) return;
      i.presa=!i.presa; i.tsp=i.presa?Date.now():null;
      if(i.presa){
        const r=el.getBoundingClientRect(); coriandoli(r.left+13,r.top+13,10);
        if(S.obiettivo&&S.obiettivo.rif===i.id) toast('Comprato. L\'obiettivo della cassa resta aperto: chiudilo dal Tesoretto.');
      }
      await salva(); disegna();
    };
  });
  document.querySelectorAll('#vista [data-lsdel]').forEach(el=>{
    el.onclick=async()=>{
      const i=S.spesa.find(x=>x.id===el.dataset.lsdel); if(!i) return;
      if(S.obiettivo&&S.obiettivo.rif===i.id&&
        !confirm('"'+i.t+'" è l\'obiettivo della cassa. Lo tolgo da lista e obiettivo?')) return;
      if(S.obiettivo&&S.obiettivo.rif===i.id) S.obiettivo=null;
      S.spesa=S.spesa.filter(x=>x.id!==i.id);
      await salva(); disegna(); toast('Tolto dalla lista.');
    };
  });
  document.querySelectorAll('#vista [data-obj]').forEach(el=>{
    el.onclick=async()=>{
      const i=S.spesa.find(x=>x.id===el.dataset.obj); if(!i) return;
      const v=parseFloat((prompt('Quanto costa "'+i.t+'"? Scrivi solo la cifra in euro.','')||'')
        .replace(',','.'));
      if(!(v>0)){ toast('Serve un costo in euro.'); return; }
      S.obiettivo={rif:i.id,t:i.t,costo:Math.round(v*100)/100,chi:io,ts:Date.now()};

  if(bok) bok.onclick=async()=>{
    const ob=S.obiettivo; if(!ob) return;
    if(ob.costo>S.cassa&&!confirm('In cassa ci sono '+eur(S.cassa)+' su '+eur(ob.costo)+

    if(ob.costo<=S.cassa&&!confirm('Escono '+eur(ob.costo)+' dalla cassa per '+ob.t+'. Confermo?')) return;
    S.cassa=Math.round((S.cassa-ob.costo)*100)/100;
    S.movimenti.unshift({id:'o'+Date.now(),ts:Date.now(),chi:io,causale:ob.t,val:-ob.costo});
    log('spesa',io,ob.t,ob.costo);
    const it=S.spesa.find(x=>x.id===ob.rif); if(it){ it.presa=true; it.tsp=Date.now(); }
    S.obiettivo=null;
    const r=bok.getBoundingClientRect(); coriandoli(r.left+30,r.top+10,30);
    await salva(); disegna(); toast('Comprato. In cassa restano '+eur(S.cassa)+'.');
  };
  const bno=document.getElementById('bObjNo');
  if(bno) bno.onclick=async()=>{
    if(!confirm('Tolgo l\'obiettivo? La voce resta nella lista della spesa.')) return;
    S.obiettivo=null; await salva(); disegna(); toast('Obiettivo tolto.');
  };
  const bs=document.getElementById('bSpesa');
  if(bs) bs.onclick=async()=>{
    const c=document.getElementById('spC').value.trim();
    const v=parseFloat((document.getElementById('spV').value||'').replace(',','.'));
    if(!c||!(v>0)){ toast('Serve una causale e un importo.'); return; }
    if(v>S.cassa&&!confirm('In cassa ci sono '+eur(S.cassa)+'. Segno lo stesso?')) return;
    S.cassa=Math.round((S.cassa-v)*100)/100;
    S.movimenti.unshift({id:'s'+Date.now(),ts:Date.now(),chi:io,causale:c,val:-v});
    log('spesa',io,c,v);
    await salva(); disegna(); toast('Spesa segnata. Restano '+eur(S.cassa)+'.');
  };
  const cf=document.getElementById('cifra');
  if(cf){
    const tot=S.cassa; let s=null;
    const step=t=>{ if(!s)s=t; const p=Math.min(1,(t-s)/900);
      cf.textContent='€ '+(Math.round(tot*(1-Math.pow(1-p,3))*100)/100).toString().replace('.',',');
      if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setTimeout(()=>document.querySelectorAll('.fil').forEach(f=>f.style.width=f.dataset.w+'%'),60);
  }
  const be=document.getElementById('bExp');
  if(be) be.onclick=async()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{ await navigator.clipboard.writeText(code); toast('Codice copiato. Mandalo in chat di famiglia.'); }
    catch(e){ prompt('Copia questo codice:',code); }
  };
  const bi=document.getElementById('bImp');
  if(bi) bi.onclick=async()=>{
    const c=prompt('Incolla il codice ricevuto:'); if(!c) return;
    try{ S=JSON.parse(decodeURIComponent(escape(atob(c.trim())))); await salva(); disegna();
      toast('Partita allineata.'); }catch(e){ toast('Codice non valido, controlla di averlo copiato tutto.'); }
  };
  const br=document.getElementById('bReset');
  if(br) br.onclick=async()=>{
    if(!confirm('Azzero tutto: missioni, flash, cassa, diario, debiti. La lista della spesa resta. '+
      'Non si torna indietro.')) return;
    const rit=S.ritiri, par=S.parita, lis=S.spesa;
    S=vuoto(); S.ritiri=rit; S.parita=par; S.spesa=lis||[];
    S.settimana=1; S.inizio=lunedi(Date.now()); S.avviata=Date.now()>=INIZIO_S1;
    await salva(); vista='missioni'; disegna(); toast('Partita azzerata.');
  };
}

function attaccaRoulette(){
  const b=document.getElementById('bSpin'); if(!b) return;
  b.onclick=async()=>{
    if(girando) return; girando=true;
    b.disabled=true; b.textContent='La ruota gira…';
    const ruota=document.querySelector('.ruota'); ruota.classList.add('gira');
    if(!S.estratto){ estrai(); await salva(); }
    const ordine={facile:0,media:1,difficile:2,mensile:2};
    const mie=S.missioni.filter(m=>m.chi===io).sort((a,c)=>ordine[a.liv]-ordine[c.liv]);
    const slots=[].slice.call(document.querySelectorAll('.slot'));
    const pool=[].concat(SACCO.facile,SACCO.media,SACCO.difficile,SACCO.mensile).map(x=>x.t);
    const iv=slots.map(s=>{ s.classList.add('gira');
      return setInterval(()=>{ s.querySelector('.s2').textContent=pool[Math.floor(Math.random()*pool.length)]; },70); });
    slots.forEach((s,i)=>setTimeout(()=>{
      clearInterval(iv[i]); s.classList.remove('gira'); s.classList.add('fermo');
      s.querySelector('.s2').textContent=mie[i]?mie[i].t:'—';
      const r=s.getBoundingClientRect(); coriandoli(r.left+r.width/2,r.top+22,14);
      if(navigator.vibrate) navigator.vibrate(25);
    },1100+i*720));
    setTimeout(async()=>{
      ruota.classList.remove('gira');
      const r=ruota.getBoundingClientRect(); coriandoli(r.left+r.width/2,r.top+r.height/2,34);
      S.rivelato[io]=true; await salva(); girando=false; disegna();
      toast('La sorte ha parlato. In bocca al lupo.');
    },1100+slots.length*720+1000);
  };
}

/* ---- notifiche push ---- */
function b64u8(b){
  const p='='.repeat((4-b.length%4)%4);
  const t=(b+p).replace(/-/g,'+').replace(/_/g,'/'), r=atob(t), a=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++) a[i]=r.charCodeAt(i);
  return a;
}
const pushPronte=()=>'serviceWorker' in navigator&&'PushManager' in window&&SUPA.vapid&&sb;
async function attivaPush(){
  if(!pushPronte()){ toast('Su questo telefono le notifiche non sono disponibili.'); return; }
  if(!io){ toast('Prima scegli chi sei.'); return; }
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    if(await Notification.requestPermission()!=='granted'){
      toast('Permesso negato. Si riattiva dalle impostazioni del telefono.'); return; }
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,
      applicationServerKey:b64u8(SUPA.vapid)});
    await sb.from('push').upsert({casa:SUPA.casa,chi:io,sub:sub.toJSON()},{onConflict:'casa,chi'});
    try{ localStorage.setItem('casa-push',io); }catch(e){}
    toast('Notifiche attive per '+io+' su questo telefono.');
  }catch(e){ toast('Non sono riuscito ad attivarle. Aggiungi prima l\'app alla schermata home.'); }
}
async function avvisa(chi,titolo,testo){
  if(!sb||!chi||chi===io) return;
  try{ await sb.functions.invoke('notifica',{body:{casa:SUPA.casa,a:chi,titolo,testo}}); }catch(e){}
}
