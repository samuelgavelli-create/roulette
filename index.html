/* ==================== NOVITA DELL'AGGIORNAMENTO ==================== */
/* si apre una volta sola per profilo: poi solo a richiesta, dal portafoglio */
function chiudiNovita(segna){
  document.getElementById('novita').classList.remove('on');
  if(!segna||!io) return;
  try{ localStorage.setItem('casa-novita-'+VERSIONE+'-'+io,'1'); }catch(e){}
  if(!S.novita) S.novita={};
  if(S.novita[io]!==VERSIONE){ S.novita[io]=VERSIONE; salva(); }
}
function novitaViste(){
  if(!io) return true;
  if(((S&&S.novita)||{})[io]===VERSIONE) return true;
  try{ return localStorage.getItem('casa-novita-'+VERSIONE+'-'+io)==='1'; }catch(e){ return false; }
}
function mostraNovita(forza){
  if(!io||!S) return;
  if(!forza&&novitaViste()) return;
  document.getElementById('novitaIn').innerHTML=
    '<div class="grab"></div><span class="nvk">AGGIORNAMENTO '+VERSIONE.toUpperCase()+'</span>'+
    '<h3>Da questa settimana si gioca cos\u00ec</h3>'+
    '<p class="nvs">Le regole nuove, in breve. Le ritrovi sempre nel Regolamento.</p>'+
    '<div class="nvl">'+NOVITA().map(n=>'<div class="nvi"><span class="ic">'+n[0]+'</span>'+
      '<span class="tx"><b>'+n[1]+'</b><span>'+n[2]+'</span></span></div>').join('')+'</div>'+
    '<button class="btn" id="nvOk">Ho capito, si gioca</button>';
  document.getElementById('novita').classList.add('on');
  document.getElementById('nvOk').onclick=()=>chiudiNovita(true);
}

/* ==================== FOGLI CHE SI CHIUDONO TRASCINANDO ==================== */
function trascinaChiudi(el,chiudi){
  if(!el || el.dataset.dragReady==='1') return;
  el.dataset.dragReady='1';
  let y0=0,dy=0,presa=false,puntatore=null,annulla=false;
  const reset=(animate=true)=>{
    el.style.transition=animate?'transform .28s var(--sp)':'none';
    el.style.transform='';
    setTimeout(()=>{el.style.transition='';},300);
    y0=0;dy=0;presa=false;puntatore=null;annulla=false;
  };
  const daManiglia=t=>!!(t&&t.closest&&t.closest('.grab,h3,.dsub'));
  el.addEventListener('pointerdown',e=>{
    if(e.isPrimary===false) return;
    if(e.button!==undefined && e.button!==0) return;
    const maniglia=daManiglia(e.target);
    if(!maniglia && el.scrollTop>0) return;
    y0=e.clientY; dy=0; presa=true; puntatore=e.pointerId; annulla=!maniglia;
    el.setPointerCapture?.(e.pointerId);
    el.style.transition='none';
  },{passive:false});
  el.addEventListener('pointermove',e=>{
    if(!presa || e.pointerId!==puntatore) return;
    dy=e.clientY-y0;
    if(dy<0) dy=Math.max(-20,dy/5);
    if(dy>4&&e.cancelable) e.preventDefault();
    const real=Math.max(0,dy);
    el.style.transform=real?'translateY('+real+'px)':'';
  },{passive:false});
  const end=e=>{
    if(!presa || e.pointerId!==puntatore) return;
    const chiudiOra=dy>(annulla?96:64);
    reset(!chiudiOra);
    if(chiudiOra){
      if(navigator.vibrate) navigator.vibrate(6);
      chiudi();
    }
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',e=>{
    /* se il gesto partiva dalla maniglia e il browser prova a rubarcelo,
       chiudiamo lo stesso quando il dito era già sceso abbastanza */
    if(presa&&!annulla&&dy>64){ reset(false); chiudi(); return; }
    reset(true);
  });
}

/* ==================== AVVIO ==================== */
/* il sipario resta su almeno un secondo, poi si alza e la casa compare */
const T0=Date.now(), LENTO=matchMedia('(prefers-reduced-motion: reduce)').matches;
function viaSplash(){
  document.body.classList.add('pronta');
  const s=document.getElementById('splash');
  if(!s||s.dataset.via) return;
  s.dataset.via='1'; s.classList.add('via');
  setTimeout(()=>{ if(s.parentNode) s.remove(); },620);
}
setTimeout(viaSplash,3200);
(async()=>{
  try{ await carica(); await salva(); }catch(e){ viaSplash(); }
  disegnaGate();
  trascinaChiudi(document.getElementById('sheetIn'),chiudiSheet);
  trascinaChiudi(document.getElementById('novitaIn'),()=>chiudiNovita(true));
  document.getElementById('novita').querySelector('.nbk').onclick=()=>chiudiNovita(true);
  if(io){ const g=document.getElementById('gate'); if(g) g.style.display='none';
    document.getElementById('app').style.display=''; disegna();
    setTimeout(()=>mostraNovita(),1300); }
  setTimeout(viaSplash,Math.max(0,(LENTO?0:1150)-(Date.now()-T0)));
  try{
    const q=new URLSearchParams(location.search).get('v');
    if(q) vista=q;
  }catch(e){}
  avvia_sync();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  aggiornaPush(false);
  setTimeout(()=>{ ricollegaPush(); aggiornaPush(true); },4000);
  setInterval(async()=>{
    const a=avvioUfficiale(), b=rollover(), c=chiudiSpazzatura(),
          d=chiudiFlash(), e=chiudiServizi();
    chiudiScambi();
    if(a||b||c||d||e){ await salva(); if(io) disegna(); if(a) toast('Si parte. Settimana 1.'); }
  },60000);
})();
