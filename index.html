<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF3F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roulette">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Roulette di Casa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D241E'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='%23D9A441' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23D9A441'/%3E%3Cpath d='M32 6l5 8H27z' fill='%23D9A441'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D241E'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='%23D9A441' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23D9A441'/%3E%3Cpath d='M32 6l5 8H27z' fill='%23D9A441'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF3F0; --bg-2:#E4EBE6; --card:#FFFFFF;
  --ink:#10231D; --ink-2:#54655E; --ink-3:#7B8C85;
  --line:#E2E9E4; --line-2:#CEDAD4;
  --verde:#0F5C4A; --verde-2:#12866B; --verde-3:#E6F1EC; --verde-4:#0A3F33;
  --oro:#A07211; --oro-2:#E2B23C; --oro-3:#FBF1D9;
  --rosso:#BC3B26; --rosso-2:#FBEAE6;
  --gold:#A07211; --gold-d:#7C5709; --paper:#FFFFFF; --paper-2:#F5F8F6;
  --felt:#0F5C4A; --felt-2:#0A3F33;
  --om:0 1px 2px rgba(16,35,29,.05),0 10px 24px -14px rgba(16,35,29,.22);
  --om-2:0 2px 6px rgba(16,35,29,.06),0 22px 44px -22px rgba(16,35,29,.34);
  --sp:cubic-bezier(.22,1.2,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{background:var(--bg);color:var(--ink);
  font-family:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(90% 55% at 50% -8%,rgba(18,134,107,.14) 0%,rgba(18,134,107,0) 62%),
    radial-gradient(70% 40% at 100% 100%,rgba(226,178,60,.13) 0%,rgba(226,178,60,0) 70%),
    var(--bg);}
#bg::before{content:'';position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle,rgba(16,35,29,.055) 1px,transparent 1.2px);
  background-size:20px 20px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);
  mask-image:linear-gradient(180deg,#000,transparent 70%);}
@keyframes spin{to{transform:rotate(360deg);}}
.mono{font-family:'DM Mono',ui-monospace,monospace;font-feature-settings:'tnum';}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;
  padding:0 15px calc(104px + env(safe-area-inset-bottom));}
button{font-family:inherit;color:inherit;}
:focus-visible{outline:2.5px solid var(--verde-2);outline-offset:2px;border-radius:6px;}

/* ===== APERTURA ===== */
#splash{position:fixed;inset:0;z-index:70;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .5s ease,transform .6s var(--sp);}
#splash.via{opacity:0;transform:scale(1.08);pointer-events:none;}
.sp-mark{width:96px;height:96px;position:relative;}
.sp-mark svg{width:100%;height:100%;overflow:visible;}
.sp-mark .anello{fill:none;stroke:var(--verde);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:264;stroke-dashoffset:264;animation:traccia .85s cubic-bezier(.5,0,.2,1) .05s forwards;}
.sp-mark .raggi{stroke:var(--line-2);stroke-width:2.5;opacity:0;animation:appari .5s .5s forwards;}
.sp-mark .pallina{fill:var(--oro-2);transform-origin:48px 48px;transform-box:view-box;
  animation:giroPallina 1.05s cubic-bezier(.35,0,.25,1) .12s both;}
.sp-mark .perno{fill:var(--verde);opacity:0;animation:appari .4s .62s forwards;}
@keyframes traccia{to{stroke-dashoffset:0;}}
@keyframes appari{to{opacity:1;}}
@keyframes giroPallina{from{transform:rotate(0) scale(.6);}to{transform:rotate(430deg) scale(1);}}
.sp-nome{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
  opacity:0;animation:saleDolce .5s .55s both;}
.sp-nome span{color:var(--ink-3);font-weight:400;}
@keyframes saleDolce{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ===== GATE ===== */
#gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;
  padding:26px 20px calc(26px + env(safe-area-inset-bottom));background:var(--bg);
  transition:opacity .45s,transform .45s;}
#gate.via{opacity:0;pointer-events:none;}
#gate.zoom{transition:opacity .5s ease .16s,transform .62s cubic-bezier(.5,0,.32,1);}
.gate-in{position:relative;z-index:1;max-width:420px;margin:0 auto;width:100%;}
.gate-in.sfuma{transition:opacity .34s;}
.gate-in.sfuma .kick,.gate-in.sfuma h1,.gate-in.sfuma .sub{opacity:0;transition:opacity .3s;}
.kick{font-size:13px;color:var(--verde-2);font-weight:600;margin:0 0 10px;text-align:center;
  animation:up .6s both;}
.gate-in h1{font-weight:800;font-size:clamp(34px,11vw,46px);line-height:.95;margin:0 0 10px;
  letter-spacing:-.035em;text-align:center;animation:up .6s .06s both;}
.gate-in h1 em{font-style:normal;color:var(--verde);}
.gate-in .sub{text-align:center;font-size:14px;color:var(--ink-2);margin:0 0 20px;
  animation:up .6s .12s both;}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.profili{display:flex;flex-direction:column;gap:10px;}
.prof{position:relative;display:flex;align-items:center;gap:14px;border-radius:18px;
  padding:12px 14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--om);
  cursor:pointer;text-align:left;min-height:76px;
  transition:transform .18s var(--sp),box-shadow .2s;animation:up .45s both;}
.prof:nth-child(2){animation-delay:.05s}.prof:nth-child(3){animation-delay:.1s}.prof:nth-child(4){animation-delay:.15s}
.prof:active{transform:scale(.98);}
.prof .glow{display:none;}
.prof .freccia{margin-left:auto;font-size:18px;color:var(--ink-3);flex:none;}
.gettone{position:relative;width:52px;height:52px;margin:0;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;
  letter-spacing:.02em;box-shadow:0 4px 12px -5px rgba(16,35,29,.55);}
.gettone::after{content:'';position:absolute;inset:6px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.4);}
.prof .pt{min-width:0;}
.prof .pn{font-weight:700;font-size:17px;letter-spacing:-.01em;}
.prof .pr{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.prof.scelto{z-index:3;animation:none!important;
  transition:transform .62s cubic-bezier(.5,0,.32,1),box-shadow .4s;
  box-shadow:0 0 0 2px var(--verde),var(--om-2);}
.prof.scelto .gettone{transition:transform .5s var(--sp);transform:scale(1.16);}
.prof.spento{transition:opacity .34s,transform .34s;opacity:0;transform:scale(.9);animation:none!important;}

/* ===== BARRA ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;
  padding:calc(10px + env(safe-area-inset-top)) 15px 10px;margin:0 -15px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid var(--line);}
.tb-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;flex:none;transition:transform .18s var(--sp);
  font-weight:700;font-size:13px;color:#fff;box-shadow:0 3px 10px -3px rgba(16,35,29,.5);}
.tb-av::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1.5px solid var(--line-2);}
.tb-av:active{transform:scale(.92);}
.tb-txt{line-height:1.2;min-width:0;flex:1;}
.tb-txt b{font-size:16px;font-weight:700;display:block;letter-spacing:-.02em;}
.tb-txt span{font-size:11.5px;color:var(--ink-3);}
.cassa-pill{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;cursor:pointer;
  padding:7px 12px 7px 10px;border-radius:20px;background:var(--oro-3);
  border:1px solid rgba(160,114,17,.22);transition:transform .16s var(--sp);}
.cassa-pill:active{transform:scale(.94);}
.cassa-pill i{width:15px;height:15px;border-radius:50%;flex:none;font-style:normal;
  background:radial-gradient(circle at 34% 30%,#F3D089,#C08D26);}
.cassa-pill b{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--oro);
  font-feature-settings:'tnum';}
.tb-btn{display:none;}
#menu{display:none;}

/* ===== BARRA IN BASSO ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:32;display:grid;
  grid-template-columns:repeat(5,1fr);gap:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line);
  max-width:540px;margin:0 auto;animation:tabIn .5s .1s var(--sp) both;}
@keyframes tabIn{from{transform:translateY(100%);}to{transform:none;}}
.tb-ind{position:absolute;top:7px;left:6px;width:calc((100% - 12px)/5);
  height:calc(100% - 14px - env(safe-area-inset-bottom));
  transform:translateX(calc(var(--i,0) * 100%));
  transition:transform .42s var(--sp);pointer-events:none;}
.tb-ind::after{content:'';position:absolute;inset:0 7px;border-radius:15px;background:var(--verde-3);}
.tabi{position:relative;z-index:1;background:none;border:0;cursor:pointer;padding:7px 2px 5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);
  font-size:10.5px;font-weight:500;letter-spacing:-.01em;transition:color .25s;}
.tabi svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .34s var(--sp);}
.tabi.att{color:var(--verde);font-weight:600;}
.tabi.att svg{transform:translateY(-1px) scale(1.1);}
.tabi:active svg{transform:scale(.86);}
.tabi .pip{position:absolute;top:5px;right:calc(50% - 17px);min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--rosso);color:#fff;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 0 0 2px #fff;animation:pipIn .4s var(--sp) both;}
@keyframes pipIn{from{transform:scale(0);}to{transform:none;}}

/* ===== VOCI (foglio Altro) ===== */
.mi{display:flex;align-items:center;gap:13px;padding:15px 4px;min-height:54px;cursor:pointer;
  border-bottom:1px solid var(--line);font-size:15px;font-weight:500;}
.mi:last-child{border-bottom:0;}
.mi-g{font-size:10px;letter-spacing:.09em;font-weight:800;color:var(--ink-3);
  text-transform:uppercase;margin:14px 0 6px 4px;}
.mi.att{color:var(--verde);}
.mi svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.75;}
.mi.att svg{opacity:1;}
.bd{margin-left:auto;font-family:'DM Mono',monospace;font-size:10.5px;background:var(--verde-3);
  color:var(--verde);padding:3px 9px;border-radius:20px;font-weight:500;}
.bd.rosso{background:var(--rosso-2);color:var(--rosso);}

/* ===== VISTE ===== */
.view{padding-top:18px;}
.view>*{animation:sale .5s cubic-bezier(.2,.85,.3,1) both;}
.view>*:nth-child(1){animation-delay:.02s}.view>*:nth-child(2){animation-delay:.07s}
.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.17s}
.view>*:nth-child(5){animation-delay:.22s}.view>*:nth-child(6){animation-delay:.26s}
.view>*:nth-child(n+7){animation-delay:.3s}
@keyframes sale{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
h2{font-weight:700;font-size:13px;letter-spacing:-.01em;color:var(--ink-3);
  margin:0 0 10px;display:flex;align-items:center;gap:9px;}
h2::after{content:'';flex:1;height:1px;background:var(--line);}
.pan{border:1px solid var(--line);border-radius:18px;padding:15px;background:var(--card);
  box-shadow:var(--om);}
.sez{margin-bottom:22px;}
.vuoto{text-align:center;font-size:14px;color:var(--ink-3);padding:22px 6px;}
.p{margin:0 0 11px;font-size:13.5px;color:var(--ink-2);line-height:1.55;}
.p:last-child{margin-bottom:0;}
.debug{border:1px solid rgba(160,114,17,.28);border-radius:14px;padding:11px 13px;margin-bottom:16px;
  background:var(--oro-3);font-size:12.5px;color:#6E4E08;display:flex;gap:11px;align-items:flex-start;}
.debug b{font-size:11px;font-weight:700;color:#fff;background:var(--oro);
  border-radius:6px;padding:3px 8px;flex:none;margin-top:1px;}

/* ===== ROULETTE ===== */
.ruota{width:128px;height:128px;margin:4px auto 18px;position:relative;}
.disco{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(var(--verde) 0 30deg,#F6FAF8 30deg 60deg);
  box-shadow:0 12px 26px -12px rgba(16,35,29,.55),inset 0 0 0 6px #fff,
    inset 0 0 0 7.5px var(--oro-2);animation:spin 30s linear infinite;}
.disco::before{content:'';position:absolute;inset:18px;border-radius:50%;background:#fff;
  box-shadow:inset 0 0 0 2px var(--line-2);}
.disco::after{content:'';position:absolute;inset:43%;border-radius:50%;background:var(--oro-2);
  box-shadow:0 0 0 4px #fff,0 0 16px rgba(226,178,60,.7);}
.ruota .pin{position:absolute;left:50%;top:-8px;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:14px solid var(--ink);filter:drop-shadow(0 2px 3px rgba(16,35,29,.3));z-index:2;}
.ruota.gira .disco{animation:spin .55s linear infinite;}
.slot{border:1.5px dashed var(--line-2);border-radius:16px;padding:13px 14px;margin-bottom:10px;
  background:#fff;display:flex;gap:13px;align-items:center;min-height:70px;transition:.3s;}
.slot .sk{width:30px;height:30px;border-radius:10px;border:1.5px dashed var(--line-2);flex:none;}
.slot .s1{font-size:11px;color:var(--ink-3);margin-bottom:3px;font-weight:500;}
.slot .s2{font-size:15px;font-weight:500;color:var(--line-2);line-height:1.25;}
.slot.gira{border-style:solid;border-color:var(--verde-3);background:var(--verde-3);}
.slot.gira .s2{color:var(--verde-2);}
.slot.fermo{border-style:solid;border-color:var(--verde);background:#fff;box-shadow:var(--om);
  animation:scatto .45s var(--sp);}
.slot.fermo .s2{color:var(--ink);}
.slot.fermo .sk{border-style:solid;border-color:var(--verde);background:var(--verde-3);}
@keyframes scatto{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}

/* ===== CARD MISSIONE ===== */
.mcard{position:relative;background:var(--card);color:var(--ink);border-radius:18px;
  margin-bottom:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--om);
  animation:cardIn .55s cubic-bezier(.2,.9,.3,1.05) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:none;}}
.mcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2);}
.mcard:has(.liv-facile)::before{background:#5AA85C;}
.mcard:has(.liv-media)::before{background:var(--oro-2);}
.mcard:has(.liv-difficile)::before{background:#D2624A;}
.mcard:has(.liv-mensile)::before{background:var(--verde);}
.mcard:has(.liv-flash)::before{background:var(--rosso);}
.mtop{display:flex;align-items:center;gap:7px;padding:11px 14px 0 17px;flex-wrap:wrap;}
.liv{font-size:11px;letter-spacing:.01em;padding:3px 9px;border-radius:7px;font-weight:600;}
.liv-facile{background:#E7F2E5;color:#2F5B2F;}
.liv-media{background:var(--oro-3);color:#7A560B;}
.liv-difficile{background:#FBE9E4;color:#93331F;}
.liv-mensile{background:var(--verde);color:#fff;}
.liv-spazzatura{background:var(--verde-3);color:var(--verde);}
.liv-flash{background:var(--rosso);color:#fff;}
.tagx{font-size:10.5px;font-weight:600;color:var(--rosso);background:var(--rosso-2);
  border:0;padding:3px 8px;border-radius:7px;}
.quota{margin-left:auto;font-family:'DM Mono',monospace;font-size:14px;font-weight:500;
  color:var(--oro);font-feature-settings:'tnum';}
.mbody{display:flex;gap:13px;padding:11px 14px 13px 17px;align-items:flex-start;}
.chk{width:32px;height:32px;flex:none;border-radius:11px;border:2px solid var(--line-2);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.25s var(--sp);}
.chk svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s .06s;}
.chk.on{background:var(--verde-2);border-color:var(--verde-2);transform:scale(1.08);}
.chk.on svg{stroke-dashoffset:0;}
.mtit{font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em;}
.mtit.done{text-decoration:line-through;text-decoration-color:var(--line-2);color:var(--ink-3);}
.mnote{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.4;}
.mfoot{display:flex;align-items:center;gap:9px;padding:9px 14px 10px 17px;
  border-top:1px solid var(--line);background:#FBFDFC;
  font-size:12px;color:var(--ink-3);}
.mfoot .cd{margin-left:auto;font-family:'DM Mono',monospace;font-weight:500;color:var(--ink-2);
  font-feature-settings:'tnum';}
.mfoot .cd.urg{color:var(--rosso);animation:puls 1.2s ease-in-out infinite;}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.45}}
.mcard.flash{border-color:rgba(188,59,38,.4);}
.mcard.rubabile{border-color:var(--oro-2);box-shadow:0 0 0 3px var(--oro-3),var(--om);}
.btn-ruba{margin-left:auto;padding:8px 14px;border-radius:11px;border:none;background:var(--verde);
  color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;flex:none;}
.btn-ruba:active{transform:scale(.95);}
.btn-x{margin-left:auto;padding:6px 11px;border-radius:10px;border:1px solid var(--line-2);
  background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer;flex:none;}
.lock{position:absolute;inset:0;background:rgba(240,244,242,.86);backdrop-filter:blur(2px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;}
.lock .chain{position:absolute;left:-8%;width:116%;height:26px;opacity:.5;}
.lock .chain.a{top:26%;transform:rotate(-7deg);}
.lock .chain.b{top:60%;transform:rotate(5deg);}
.lock .pad{width:40px;height:40px;position:relative;z-index:2;
  filter:drop-shadow(0 4px 8px rgba(16,35,29,.22));}
.lock .lt{position:relative;z-index:2;font-size:11.5px;font-weight:600;color:var(--ink-2);
  text-align:center;padding:0 18px;line-height:1.45;}
.mcard.shake{animation:shake .5s;}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ===== RIGHE / CONTROLLI ===== */
.riga{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:14px;}
.riga:last-child{border-bottom:none;}
.pall{width:10px;height:10px;border-radius:50%;flex:none;}
.riga .rt{flex:1;min-width:0;}
.riga .rt b{font-weight:600;display:block;font-size:14px;letter-spacing:-.01em;}
.riga .rt span{font-size:12px;color:var(--ink-3);}
.spunta{color:var(--verde-2);font-size:16px;}
.mini{width:30px;height:30px;flex:none;border-radius:10px;border:1.5px solid var(--line-2);
  background:#fff;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.2s var(--sp);}
.mini:active{transform:scale(.9);}
.mini.on{background:var(--verde-2);border-color:var(--verde-2);color:#fff;}
.btn{width:100%;padding:17px;border:none;border-radius:16px;cursor:pointer;background:var(--verde);
  color:#fff;font-weight:700;font-size:16.5px;letter-spacing:-.01em;
  box-shadow:0 10px 22px -12px rgba(15,92,74,.9);transition:transform .12s var(--sp),box-shadow .2s;}
.btn:active{transform:scale(.975);box-shadow:0 4px 10px -8px rgba(15,92,74,.9);}
.btn:disabled{opacity:.6;}
.btn-r{background:var(--rosso);box-shadow:0 10px 22px -12px rgba(188,59,38,.9);}
.btn-o{width:100%;padding:14px;border-radius:14px;cursor:pointer;background:#fff;
  border:1.5px solid var(--rosso);color:var(--rosso);font-weight:600;font-size:14.5px;}
.btn-g{width:100%;padding:13px;border-radius:14px;cursor:pointer;background:#fff;
  border:1px solid var(--line-2);color:var(--ink-2);font-size:14px;font-weight:500;margin-top:8px;}
.btn-s{padding:11px 15px;border-radius:12px;cursor:pointer;background:var(--verde);border:none;
  color:#fff;font-weight:600;font-size:13.5px;flex:none;}
.btn-g:active,.btn-o:active,.btn-s:active{transform:scale(.97);}
.inp{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink);font-family:inherit;font-size:15px;margin-bottom:8px;}
.inp::placeholder{color:var(--ink-3);}
.inp:focus{outline:none;border-color:var(--verde-2);box-shadow:0 0 0 3px var(--verde-3);}
.row{display:flex;gap:8px;align-items:center;}
.chip{display:flex;gap:7px;margin-bottom:11px;}
.chip button{flex:1;padding:12px 4px;border-radius:13px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;transition:.2s;}
.chip button.on{color:#10231D;font-weight:600;border-color:transparent;}
span.chip{display:inline-flex;align-items:center;margin:0;font-size:10.5px;font-weight:600;
  border:1px solid var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-3);
  white-space:nowrap;}
span.chip.au{color:var(--oro);border-color:rgba(160,114,17,.35);background:var(--oro-3);}
span.chip.ok{color:var(--verde-2);border-color:rgba(18,134,107,.35);background:var(--verde-3);}

/* ===== CALENDARIO ===== */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-h b{font-weight:700;font-size:19px;text-transform:capitalize;letter-spacing:-.02em;}
.nav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-2);background:#fff;
  color:var(--ink);cursor:pointer;font-size:17px;line-height:1;}
.nav:active{background:var(--bg-2);}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
.dows span{text-align:center;font-size:10.5px;color:var(--ink-3);font-weight:500;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.day{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;font-family:'DM Mono',monospace;font-size:12.5px;color:var(--ink);
  animation:dpop .32s var(--sp) both;}
@keyframes dpop{from{opacity:0;transform:scale(.75);}to{opacity:1;transform:none;}}
.day.off{opacity:.28;pointer-events:none;}
.day.oggi{border-color:var(--verde);color:var(--verde);box-shadow:0 0 0 1.5px var(--verde) inset;
  font-weight:500;}
.day.rit{background:var(--verde-3);border-color:transparent;}
.day:active{transform:scale(.93);}
.dots{display:flex;gap:2.5px;height:5px;align-items:center;}
.dots i{width:4.5px;height:4.5px;border-radius:50%;display:block;}
.lg{display:flex;gap:13px;flex-wrap:wrap;justify-content:center;margin-top:13px;
  font-size:11.5px;color:var(--ink-3);}
.lg span{display:flex;align-items:center;gap:5px;}
.lg i{width:8px;height:8px;border-radius:50%;display:block;}

/* ===== SHEET ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none;}
#sheet.on{display:block;}
#sheet .bk{position:absolute;inset:0;background:rgba(16,35,29,.32);backdrop-filter:blur(4px);
  animation:fadeIn .3s both;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;
  background:var(--card);border-radius:26px 26px 0 0;
  padding:12px 18px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 50px -20px rgba(16,35,29,.4);
  animation:su .42s var(--sp);max-width:540px;margin:0 auto;}
@keyframes su{from{transform:translateY(100%);}to{transform:none;}}
.sh .grab{width:40px;height:4.5px;border-radius:3px;background:var(--line-2);margin:0 auto 16px;}
.sh h3{margin:0 0 3px;font-size:21px;font-weight:700;letter-spacing:-.025em;}
.sh .dsub{font-size:13px;color:var(--ink-3);margin-bottom:16px;line-height:1.45;}

/* ===== SPAZZATURA ===== */
.next{text-align:center;padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:15px;}
.next .nt{font-size:12px;color:var(--ink-3);margin-bottom:5px;font-weight:500;}
.next .nn{font-weight:800;font-size:clamp(20px,6vw,25px);letter-spacing:-.03em;line-height:1.15;overflow-wrap:anywhere;}
.next .nc{font-family:'DM Mono',monospace;font-size:13.5px;color:var(--verde-2);margin-top:5px;}
.next .nb{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 13px;
  border-radius:20px;background:var(--bg-2);font-size:12.5px;color:var(--ink-2);font-weight:500;}
.next .nb i{width:9px;height:9px;border-radius:50%;flex:none;font-style:normal;}
.tipo{margin-bottom:17px;}
.tipo-h{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.tipo-h .sq{width:14px;height:14px;border-radius:5px;flex:none;}
.tipo-h b{font-weight:600;font-size:14px;}
.tipo-h .fq{margin-left:auto;font-size:11px;color:var(--ink-3);background:var(--bg-2);
  border-radius:20px;padding:3px 9px;font-weight:500;}
.gg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.g{aspect-ratio:1;min-width:0;padding:0;border-radius:10px;border:1px solid var(--line);background:#fff;
  color:var(--ink-3);font-family:'DM Mono',monospace;font-size:11px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s var(--sp);}
@media (max-width:360px){ .g{font-size:10px;} .gg{gap:3px;} }
.g.on{color:#10231D;font-weight:500;border-color:transparent;transform:scale(1.06);}
.par{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;}
.par span{min-width:0;}
.par button{margin-left:auto;padding:7px 12px;border-radius:10px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink-2);font-size:12px;cursor:pointer;flex:none;}
.bin{border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:10px;
  background:#fff;box-shadow:var(--om);}
.bin.off{opacity:.55;box-shadow:none;}
.bin-h{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.bin-h .sq{width:13px;height:13px;border-radius:4px;flex:none;}
.bin-h b{font-weight:600;font-size:14px;flex:1;min-width:0;}
.bin-s{font-size:12.5px;color:var(--ink-3);margin:0 0 10px;line-height:1.45;}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
.who i{width:22px;height:22px;border-radius:50%;flex:none;font-style:normal;font-weight:700;
  font-size:9.5px;color:#fff;display:flex;align-items:center;justify-content:center;}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:12px;}

/* ===== LISTA ===== */
.ob{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ob b{font-weight:600;font-size:16px;line-height:1.25;letter-spacing:-.01em;}
.ob .oc{margin-left:auto;font-family:'DM Mono',monospace;font-size:14px;color:var(--oro);flex:none;}
.obar{height:12px;border-radius:7px;background:var(--bg-2);overflow:hidden;}
.obar .fil{display:block;height:100%;}
.riga .mini+.mini{margin-left:2px;}
.hint{font-size:12px;color:var(--ink-3);margin:0 0 10px;font-weight:500;}

/* ===== TESORETTO ===== */
.forziere{position:relative;text-align:center;padding:26px 16px 24px;margin-bottom:16px;
  border-radius:24px;overflow:hidden;background:
    radial-gradient(120% 90% at 50% -20%,#17705B 0%,#0F5C4A 45%,#0A3F33 100%);
  box-shadow:0 24px 44px -26px rgba(10,63,51,.9);}
.pan>.forziere:first-child{margin:-15px -15px 15px;border-radius:17px 17px 0 0;}
.forziere::after{content:'';position:absolute;inset:-60% -20% auto;height:120%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(226,178,60,.16) 14%,transparent 28%,
    transparent 62%,rgba(226,178,60,.11) 76%,transparent 92%);animation:spin 28s linear infinite;}
.forziere>*{position:relative;z-index:1;}
.cifra{font-weight:800;font-size:clamp(44px,15vw,60px);line-height:1;letter-spacing:-.045em;
  color:#FFF3D6;text-shadow:0 4px 30px rgba(226,178,60,.45);font-feature-settings:'tnum';}
.cifra-l{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:9px;font-weight:500;}
.monete{display:flex;justify-content:center;gap:5px;margin-bottom:14px;height:30px;
  align-items:flex-end;}
.moneta{width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#F7DFA4,#C08D26);
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.4);
  animation:cade .6s var(--sp) both;}
@keyframes cade{from{opacity:0;transform:translateY(-30px) rotate(-50deg);}to{opacity:1;transform:none;}}
.deb{display:flex;align-items:center;gap:10px;padding:9px 0;}
.deb .dn{width:62px;font-size:13.5px;font-weight:500;flex:none;}
.trk{flex:1;height:10px;border-radius:6px;background:var(--bg-2);overflow:hidden;}
.fil{height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.3,1);}
.deb .di{font-family:'DM Mono',monospace;font-size:13px;width:50px;text-align:right;flex:none;}
.debb{padding:3px 0 11px;border-bottom:1px solid var(--line);}
.debb:last-of-type{border-bottom:0;padding-bottom:0;}
.dvoci{margin-top:3px;padding:10px 12px;border-radius:13px;background:var(--bg-2);display:grid;gap:8px;}
.dv{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-2);}
.dv .dvt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dv .dvd{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;}
.dv .dvv{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--rosso);flex:none;
  width:48px;text-align:right;}
.dv.piu{color:var(--ink-3);}
.tar{font-size:13px;color:var(--ink-2);line-height:1.85;margin:0;}
.tar b{color:var(--oro);font-weight:600;font-family:'DM Mono',monospace;font-size:12.5px;}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.st{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);
  box-shadow:var(--om);}
.st .sv{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;line-height:1;
  letter-spacing:-.02em;font-feature-settings:'tnum';}
.st .sl{font-size:11.5px;color:var(--ink-3);margin-top:6px;}
.reg{display:flex;gap:12px;padding:12px 0;font-size:13.5px;color:var(--ink-2);line-height:1.5;
  border-bottom:1px solid var(--line);}
.reg:last-child{border-bottom:none;}
.reg .n{font-family:'DM Mono',monospace;font-size:11px;color:var(--verde-2);flex:none;padding-top:3px;}

/* ===== SERVIZI ===== */
.svc{border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:10px;
  background:#fff;box-shadow:var(--om);}
.svc-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.svc-h b{font-size:14px;flex:1;font-weight:600;}
.svc-h .bl{font-size:11.5px;color:var(--ink-3);flex:none;}
.svc-chi{font-size:12.5px;font-weight:600;}
.gio{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;}
.svc-f{display:flex;align-items:center;gap:8px;margin-top:10px;}
.svc-f .svc-chi{flex:1;}
.svc.mio{border-color:rgba(15,92,74,.35);box-shadow:0 0 0 3px var(--verde-3),var(--om);}
.gio button{border:1px solid var(--line);background:#fff;color:var(--ink-3);border-radius:11px;
  padding:8px 0 7px;font:inherit;font-size:10px;cursor:pointer;line-height:1.35;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.18s var(--sp);}
.gio button .dd{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--ink);}
.gio button.on{background:var(--verde-3);border-color:transparent;color:var(--verde-2);}
.gio button.on .dd{color:var(--verde-2);}
.gio button.altro{opacity:.45;}
.gio button.oggi{border-color:var(--verde);}
.gio button.persa{border-color:rgba(188,59,38,.45);color:var(--rosso);background:var(--rosso-2);}
.gio button.persa .dd{color:var(--rosso);}
.gio button .mk{font-family:'DM Mono',monospace;font-size:11px;line-height:1;}
.gio button:active{transform:scale(.94);}
.svc-w{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
.svc-w .per{margin-left:auto;font-size:11.5px;color:var(--ink-3);}
.tonight{display:grid;gap:9px;}
.tn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;background:#fff;}
.tn{border:0;color:#fff;}
.tn.mio{box-shadow:0 0 0 2.5px var(--ink);}
.tn .tt span{color:rgba(255,255,255,.8);}
.tn .sq{background:rgba(255,255,255,.92)!important;}
.tn .who{color:#fff;}
.tn .who i{background:#fff!important;}
.tn .sei{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.22);color:#fff;}
.tn .mini{background:rgba(255,255,255,.92);border-color:transparent;color:var(--ink);}
.tn .sq{width:11px;height:11px;border-radius:4px;flex:none;}
.tn .tt{flex:1;min-width:120px;}
.tn .tt b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;}
.tn .tt span{font-size:11.5px;color:var(--ink-3);}

/* ===== TURNI A COLORI ===== */
/* la card del turno è tutta del colore di chi ce l'ha: --pc.
   le uniche caselle chiare sono i giorni, che prendono il colore di chi spunta. */
.svc{--pc:#54655E;border:0;border-radius:18px;padding:14px 14px 12px;margin-bottom:11px;
  background:var(--pc);color:#fff;box-shadow:0 12px 26px -16px var(--pc),var(--om);}
.svc.mio{box-shadow:0 0 0 2.5px var(--ink),0 14px 28px -16px var(--pc);}
.svc-h{margin-bottom:9px;}
.svc-h b{font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff;}
.svc-h .bl{font-family:'DM Mono',monospace;color:rgba(255,255,255,.82);}
.svc-h .pall{width:11px;height:11px;background:rgba(255,255,255,.92)!important;}
.svc .who{color:#fff;font-size:13.5px;}
.svc .who i{background:#fff!important;color:var(--pc);}
.svc-w{margin-bottom:11px;}
.svc-w .per{color:rgba(255,255,255,.78);}
.svc .sei{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.22);color:#fff;}
.svc .tagd{background:rgba(255,255,255,.22);color:#fff;}
.svc-f{margin-top:11px;}
.svc-f .st-t{flex:1;font-size:11.5px;color:rgba(255,255,255,.82);}
.svc-f .st-t.ko{color:#FFD9D1;font-weight:600;}
.svc .btn-sc,.svc .btn-gt{background:rgba(255,255,255,.95);border:0;color:var(--ink);font-weight:600;}
.gio button{border:0;background:#fff;box-shadow:0 2px 6px -3px rgba(16,35,29,.5);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:transform .18s var(--sp),box-shadow .18s,background .18s;}
.gio button .dd{color:var(--ink);}
.gio button.on{color:#fff;}
.gio button.on .dd,.gio button.on .mk{color:#fff;}
.gio button.mia-fatta{box-shadow:0 0 0 3px rgba(16,35,29,.9),0 4px 10px -4px rgba(16,35,29,.45);}
.gio button.chiusa{opacity:.55;cursor:default;}
.gio button:not(.chiusa):active{transform:scale(.95);}
.gio button.oggi{box-shadow:0 0 0 2.5px var(--ink);}
.gio button.deleg{box-shadow:0 0 0 2px var(--oro-2);}
/* ---- bidoni: ogni riga vestita di chi ha il turno ---- */
.bidc{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;margin-bottom:8px;}
.bidc .bav{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:11.5px;}
.bidc .bt{flex:1;min-width:0;}
.bidc .bt>b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;letter-spacing:-.01em;}
.bidc .bt>b i{width:9px;height:9px;border-radius:3px;flex:none;font-style:normal;}
.bidc .bt span b{font-weight:700;}
.bidc .bt span{font-size:11.5px;color:var(--ink-2);display:block;margin-top:1px;overflow-wrap:anywhere;}
.bidc .mini{background:rgba(255,255,255,.75);}
.btn-gt{margin-left:auto;padding:7px 11px;border-radius:11px;border:1px solid var(--oro-2);
  background:var(--oro-3);color:var(--gold-d);font:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.btn-gt:active{transform:scale(.95);}
.mini.gt{border-color:var(--oro-2);background:var(--oro-3);color:var(--gold-d);font-size:13px;}
.mini.chiusa{opacity:.42;}
.tagd{font-size:10.5px;font-weight:600;color:var(--gold-d);background:var(--oro-3);
  border-radius:6px;padding:2px 7px;}

/* ===== FANTASMA / RECUPERO SERVIZI ===== */

.sync{position:fixed;left:50%;transform:translateX(-50%);

<script>
/* ==================== DATI ==================== */
const G=[
 {n:'Sonia', r:'Mamma',  h:'#C2412D', i:'SO'},
 {n:'Tony',  r:'Papà',   h:'#1F8B77', i:'TO'},
 {n:'Samuel',r:'Figlio', h:'#C9932F', i:'SA'},
 {n:'Thomas',r:'Figlio', h:'#6260B8', i:'TH'}
];
/* Palette profilo: ogni colore può appartenere a una sola persona.
   I primi quattro mantengono i colori attuali; gli altri quattro sono nuove opzioni. */
const PALETTE=[
 {k:'corallo',h:'#C2412D',nome:'Corallo'},
 {k:'verde',h:'#1F8B77',nome:'Verde laguna'},
 {k:'senape',h:'#C9932F',nome:'Senape'},
 {k:'indaco',h:'#6260B8',nome:'Indaco'},
 {k:'rosa',h:'#D45B8C',nome:'Rosa'},
 {k:'blu',h:'#4D83C4',nome:'Blu'},
 {k:'oliva',h:'#6E9B4B',nome:'Oliva'},
 {k:'terra',h:'#8B5E3C',nome:'Terra'}
];
const COL=n=>{
  if(n===io&&typeof PROVA!=='undefined'&&PROVA&&PROVA.colore&&COLORI_BOTTEGA[PROVA.colore])
    return COLORI_BOTTEGA[PROVA.colore].h;
  return (G.find(g=>g.n===n)||{h:'#54655E'}).h;
};
/* stesso colore, un gradino più scuro: serve alle card dei turni */
function scuro(h,f){
  const v=parseInt(h.slice(1),16), m=[16,35,29];
  const c=[(v>>16)&255,(v>>8)&255,v&255].map((x,i)=>Math.round(x*(1-f)+m[i]*f));
  return '#'+c.map(x=>x.toString(16).padStart(2,'0')).join('');
}
const INI=n=>(G.find(g=>g.n===n)||{i:'??'}).i;
/* con i colori chiari (fluo, metallizzato) le scritte sopra diventano scure */
function inkDi(n){
  const h=COL(n);
  const k=Object.keys(COLORI_BOTTEGA||{}).find(x=>COLORI_BOTTEGA[x].h===h);
  return k?COLORI_BOTTEGA[k].ink:'#FFFFFF';
}
const classeChiaro=n=>inkDi(n)==='#FFFFFF'?'':' su-chiaro';
/* chi è via di casa resta sul tabellone, ma congelato: non gioca questa settimana */
function congelato(n,ms){
  try{ return isFantasma(n,ms===undefined?(S.inizio||Date.now()):ms); }catch(e){ return false; }
}
const classeGelo=()=>'';   /* niente decorazioni: chi non c'è viene tolto, non ghiacciato */
/* lo stesso colore scurito quanto basta per scriverci sopra il bianco */
function coloreTesto(n){
  const h=COL(n);
  const v=parseInt(h.slice(1),16);
  const r=(v>>16)&255, g=(v>>8)&255, b=v&255;
  const luma=(0.2126*r+0.7152*g+0.0722*b)/255;

const settimanaKey=ms=>iso(lunedi(ms));

function ownerGiornoServizio(gk,si,attivi,w){
  const mon=lunedi(new Date(gk+'T12:00').getTime());

/* Prima di cambiare chi è in casa a settimana già cominciata fotografiamo i

function congelaPassato(k){
  const mon=lunediDaKey(k);

     chi l'ha messa. Tutto il resto della settimana torna nella rotazione e si
     divide fra chi è in casa, in ordine, senza sorteggi. */
  turniSett(mon).forEach(t=>{ if(t.fatta&&!S.turniOv[t.k]) S.turniOv[t.k]=t.base; });
  serviziSett(mon).forEach(t=>{ if(t.fatta&&!S.servOv[t.k]) S.servOv[t.k]=t.base; });

  if(Object.keys(S.fantasmi[k]||{}).length>=G.length-1){ toast('Deve restare almeno una persona in casa.'); return; }
  if(!confirm((suo?'Sei via':chi+' è via')+' per la settimana del '+dataBreve(k)+'?\n\n'+

  if(ritirati.flash) extra.push(ritirati.flash===1?'1 Flash annullata':ritirati.flash+' Flash annullate');

/* Quando una persona risulta via: i turni che le erano stati passati con un
   gettone tornano a chi glieli aveva dati, le Flash aperte verso di lei si
   annullano con il gettone restituito, le proposte di scambio si chiudono. */
function ritiraImpegni(chi,k){
  const lun=lunediDaKey(k), fine=iso(new Date(lun+6*864e5));
  const out={turni:0,flash:0,scambi:0};
  Object.keys(S.deleghe||{}).forEach(dk=>{
    const d=S.deleghe[dk], g=dk.split('|')[0];
    if(!d||d.a!==chi||g<k||g>fine) return;
    ridaiGettone(d.da,chi,1);
    delete S.deleghe[dk];
    out.turni++;
  });
  (S.flash||[]).forEach(f=>{
    if(f.fatta||f.chiuso||f.a!==chi) return;
    f.chiuso=true; f.annullata=true;
    ridaiGettone(f.da,chi,1);
    log('flash',chi,'Flash annullata: '+chi+' è via di casa. Gettone restituito a '+f.da,0,null,f.id);
    out.flash++;
  });
  (S.scambi||[]).forEach(x=>{
    if(x.stato!=='aperto'||(x.da!==chi&&x.a!==chi)) return;
    x.stato='annullato';
    out.scambi++;
  });
  return out;
}

function numDelta(cur,prima,dopo){
  /* applica a cur la differenza numerica (prima - dopo): serve a togliere
     l'effetto dell'azione senza cancellare eventuali modifiche arrivate da altri */
  const keys=new Set([...Object.keys(prima||{}),...Object.keys(dopo||{})]);
  keys.forEach(k=>{
    const a=prima?prima[k]:undefined, b=dopo?dopo[k]:undefined;
    if(typeof a==='number'||typeof b==='number'){
      const d=(Number(a)||0)-(Number(b)||0);
      if(d) cur[k]=Math.round(((Number(cur[k])||0)+d)*100)/100;
    }else if((a&&typeof a==='object')||(b&&typeof b==='object')){
      if(!cur[k]||typeof cur[k]!=='object') cur[k]={};
      numDelta(cur[k],a||{},b||{});
    }
  });

function annullaUltimaAzione(){

/* Ogni settimana i due servizi si spezzano in due blocchi: lun-gio e ven-dom.

function bloccoKey(mon,sv,bl){ return iso(new Date(mon+bl.gg[0]*864e5))+'|'+sv.k+'|'+bl.k; }
function blocchiSett(ms){
  const mon=lunedi(ms), w=settIdx(ms), out=[], attivi=giocatoriAttivi(mon);
  SERVIZI.forEach((sv,si)=>BLOCCHI.forEach((bl,bi)=>{
    const slot=si*BLOCCHI.length+bi;
    const base=attivi[((w+slot)%attivi.length+attivi.length)%attivi.length];
    const bk=bloccoKey(mon,sv,bl), ov=(S.servTurni||{})[bk]||{};
    const gg=bl.gg.map(off=>{ const d=new Date(mon); d.setDate(d.getDate()+off); return iso(d); });
    out.push({bk,sv,bl,base,chi:ov.chi||base,exchi:ov.exchi||null,mon,gg,
      dal:gg[0],al:gg[gg.length-1]});
  }));
  return out;
}

/* ==================== PROBABILITÀ ==================== */
/* Chiave 'm:Titolo' per la singola missione, 'g:gruppo' per tutto il gruppo.
   La singola vince sul gruppo. Se non c'è niente, è tutto equo. */
const eleggibili=m=>giocatoriAttivi(S.inizio||Date.now()).filter(n=>!m.s||m.s.includes(n));
function pesiSalvati(m){
  return (S.pesi||{})['m:'+m.t] || (S.pesi||{})['g:'+grpDi(m)] || null;
}
function pesiDi(m){
  const el=eleggibili(m), raw=pesiSalvati(m), out={};
  if(!raw){ el.forEach(n=>out[n]=100/el.length); return out; }
  const tot=el.reduce((a,n)=>a+Math.max(0,+raw[n]||0),0);
  if(tot<=0){ el.forEach(n=>out[n]=100/el.length); return out; }
  el.forEach(n=>out[n]=Math.max(0,+raw[n]||0)/tot*100);
  return out;
}
const pesoToccato=key=>!!(S.pesi||{})[key];
/* arrotonda a interi che fanno esattamente 100 */
function percInt(p){
  const ks=Object.keys(p), gr=ks.map(k=>({k,v:p[k],f:Math.floor(p[k])}));
  let r=100-gr.reduce((a,x)=>a+x.f,0);
  gr.sort((a,b)=>(b.v-b.f)-(a.v-a.f));
  const out={}; gr.forEach((x,i)=>out[x.k]=x.f+(i<r?1:0));
  return out;
}
/* muove la percentuale di una persona e ridistribuisce il resto in proporzione */
function spostaPeso(key,m,chi,delta){
  const el=eleggibili(m);
  if(!S.pesi[key]){ S.pesi[key]={}; el.forEach(n=>S.pesi[key][n]=100/el.length); }
  const p={}; el.forEach(n=>p[n]=Math.max(0,+S.pesi[key][n]||0));
  const tot=el.reduce((a,n)=>a+p[n],0)||1;
  el.forEach(n=>p[n]=p[n]/tot*100);
  const nuovo=Math.min(100,Math.max(0,p[chi]+delta));
  const resto=100-nuovo, altri=el.filter(n=>n!==chi);
  const sa=altri.reduce((a,n)=>a+p[n],0);
  altri.forEach(n=>p[n]=sa>0?p[n]/sa*resto:resto/altri.length);
  p[chi]=nuovo; S.pesi[key]=p;
}
function pesa(coppie){
  const tot=coppie.reduce((a,x)=>a+x[1],0);
  if(tot<=0) return coppie[Math.floor(Math.random()*coppie.length)][0];
  let r=Math.random()*tot;
  for(const c of coppie){ r-=c[1]; if(r<=0) return c[0]; }
  return coppie[coppie.length-1][0];
}

/* ==================== ESTRAZIONE ==================== */
/* controlla che la lista scelta si possa davvero distribuire:
   al massimo `cap` missioni a testa, rispettando le missioni ristrette. */
function distribuibile(lista,cap){
  const attivi=giocatoriAttivi(S.inizio||Date.now());
  const posti={}; attivi.forEach(n=>posti[n]=cap);
  const a=new Array(lista.length).fill(null);
  const prova=(i,visti)=>{
    for(const n of eleggibili(lista[i])){
      if(visti.has(n)) continue; visti.add(n);
      if(posti[n]>0){ posti[n]--; a[i]=n; return true; }
      for(let j=0;j<lista.length;j++) if(a[j]===n){
        a[j]=null; posti[n]++;
        if(prova(j,visti)){ posti[n]--; a[i]=n; return true; }
        a[j]=n; posti[n]--;
      }
    }
    return false;
  };
  for(let i=0;i<lista.length;i++) if(!prova(i,new Set())) return false;
  return true;
}
/* sceglie le missioni del livello: prima le fisse di questa settimana,
   poi gli arretrati, poi il sacco. Ogni aggiunta deve restare distribuibile. */
function scegliMissioni(key,quante,cap){
  const arr=S.arretrati.filter(a=>a.liv===key);
  const sel=[], usati=new Set();
  const prendi=c=>{
    if(!c||usati.has(c.t)||sel.length>=quante) return;
    sel.push(c);
    if(!distribuibile(sel,cap)){ sel.pop(); return; }
    usati.add(c.t);
  };
  const conArr=m=>{ const a=arr.find(x=>x.t===m.t);
    return {...m,arr:!!a,volte:a?(a.volte||1):0,prec:a?a.chi:null}; };
  /* le fisse escono per forza, tutto il resto è un sacchetto solo:
     gli arretrati non hanno nessuna corsia preferenziale, rientrano a caso. */
  mix(fisseDi(key)).forEach(m=>prendi(conArr(m)));
  mix(SACCO[key].filter(m=>!m.fissa)).forEach(m=>prendi(conArr(m)));
  return sel;
}
/* assegna le missioni alle persone rispettando le percentuali.
   Parte dalle più vincolate, così l'armadio non resta mai senza destinatario. */
function assegna(sel,cap){
  cap=cap||1;
  for(let t=0;t<400;t++){
    const attivi=giocatoriAttivi(S.inizio||Date.now());
    const posti={}; attivi.forEach(n=>posti[n]=cap);
    const res=[];
    const ord=mix(sel).sort((a,b)=>eleggibili(a).length-eleggibili(b).length);
    let ok=true;
    for(const m of ord){
      const cand=attivi.filter(n=>posti[n]>0&&eleggibili(m).includes(n));
      if(!cand.length){ ok=false; break; }
      const p=pesiDi(m);
      const chi=pesa(cand.map(n=>[n,((p[n]||0)+0.001)*(m.prec===n?0.15:1)]));
      res.push({m,chi}); posti[chi]--;
    }
    if(ok) return res;
  }
  /* ripiego: rispetta comunque vincoli e capienza */
  const posti={}; G.forEach(g=>posti[g.n]=cap);
  return sel.map(m=>{
    const el=eleggibili(m), cand=el.filter(n=>posti[n]>0);
    const chi=(cand.length?cand:el)[0]||G[0].n;
    posti[chi]--; return {m,chi};
  });
}
function estrai(){
  const w=S.settimana, mens=w%4===0, out=[], attivi=giocatoriAttivi(S.inizio||Date.now());
  ['facile','media','difficile'].forEach(liv=>{
    const key=(liv==='difficile'&&mens)?'mensile':liv;
    const cap=PER_LIVELLO[liv]||1;
    assegna(scegliMissioni(key,cap*attivi.length,cap),cap).forEach(({m,chi})=>{
      out.push({id:'m'+Math.random().toString(36).slice(2,9),chi,liv:key,t:m.t,n:m.n||'',
        s:m.s||null,g:grpDi(m),fissa:m.fissa||null,arr:!!m.arr,volte:m.volte||0,
        fatta:false,ruba:null,exchi:null,scambiata:false,scad:scadenzaDi(key)});
    });
  });
  S.missioni=out; S.estratto=true; S.rivelato={};
  S.arretrati=S.arretrati.filter(a=>!out.some(o=>o.t===a.t));

  if(o.tipo==='colore') applicaColoreSpeciale(id);

function entra(nome,card){
  io=nome; ricorda(io); PROVA=null;
  const g=document.getElementById('gate');
  const lento=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(card&&!lento){
    const r=card.getBoundingClientRect();
    g.style.transformOrigin=((r.left+r.width/2)/innerWidth*100).toFixed(1)+'% '+
                            ((r.top+r.height/2)/innerHeight*100).toFixed(1)+'%';
    document.querySelectorAll('.prof').forEach(p=>p.classList.add(p===card?'scelto':'spento'));
    const gi=document.querySelector('.gate-in'); if(gi) gi.classList.add('sfuma');
    requestAnimationFrame(()=>{ g.classList.add('zoom');
      g.style.transform='scale(2.9)'; g.style.opacity='0'; });

  setTimeout(()=>{ g.style.display='none';
    document.getElementById('app').style.display=''; disegna();
    setTimeout(()=>mostraNovita(),700); }, lento?300:600);

function casellaGiorno(t,attr){
  const d=new Date(t.giorno+'T12:00'), oggi=iso(Date.now());
  const passato=t.giorno<oggi, futuro=t.giorno>oggi, persa=!t.fatta&&passato;

let PIDX=[], pApri=null, pMiss=null;
function barraPerc(m){
  const p=percInt(pesiDi(m));
  return '<div class="barra">'+Object.keys(p).map(n=>
    '<i style="width:'+p[n]+'%;background:'+COL(n)+'"></i>').join('')+'</div>';
}
function controlliPerc(key,m){
  const p=percInt(pesiDi(m));
  return barraPerc(m)+'<div class="pctrl">'+eleggibili(m).map(n=>{
    const gi=PIDX.push({key,m,chi:n,d:-5})-1, pi=PIDX.push({key,m,chi:n,d:5})-1;
    return '<div class="pline"><span class="pall" style="background:'+COL(n)+'"></span>'+
      '<span class="nm">'+n+'</span>'+
      '<button data-pm="'+gi+'">−</button>'+
      '<span class="vv">'+p[n]+'%</span>'+
      '<button data-pm="'+pi+'">+</button></div>';
  }).join('')+'</div>'+
  (pesoToccato(key)?'<button class="btn-sc" data-pr="'+
    (PIDX.push({key,reset:true})-1)+'" style="margin-top:10px">Torna equa</button>':'');
}
function vProbabilita(){
  PIDX=[];
  const usati=GRUPPI.filter(g=>TUTTE().some(m=>grpDi(m)===g.k));
  let h='<div class="sez"><div class="pan"><p class="p" style="margin:0">Di base ogni missione ha la stessa '+
    'probabilità di capitare a chiunque. Se sposti una percentuale compare la barra coi vostri colori. '+
    'È un peso sull\'estrazione, non una garanzia: ogni settimana escono due facili a testa e una media '+
    'e una difficile a testa, quindi resta comunque un incastro. Le missioni segnate come fisse escono '+
    'per forza: la percentuale decide solo a chi.</p></div></div>';
  h+='<div class="sez"><h2>Gruppi</h2><div class="pan">';
  usati.forEach(g=>{
    const key='g:'+g.k, esempio=TUTTE().find(m=>grpDi(m)===g.k);
    const n=TUTTE().filter(m=>grpDi(m)===g.k).length;
    const tocc=pesoToccato(key), ap=pApri===g.k;
    const ti=PIDX.push({apri:g.k})-1;
    h+='<div class="prow"><div class="prow-h" data-pa="'+ti+'">'+
      '<span class="pall" style="background:'+(tocc?'#A07211':'#CEDAD4')+'"></span>'+
      '<span class="pt"><b>'+g.nome+'</b><span>'+n+' mission'+(n===1?'e':'i')+'</span></span>'+
      '<span class="stato '+(tocc?'att':'')+'">'+(tocc?'su misura':'equa')+'</span></div>'+
      (tocc&&!ap?barraPerc(esempio):'');
    if(ap){
      h+=controlliPerc(key,esempio);
      h+='<div class="pgrp">Eccezioni su singole missioni</div>';
      TUTTE().filter(m=>grpDi(m)===g.k).forEach(m=>{
        const mk='m:'+m.t, mt=pesoToccato(mk), mo=pMiss===m.t;
        const mi=PIDX.push({apriM:m.t})-1;
        h+='<div class="prow"><div class="prow-h" data-pa="'+mi+'">'+
          '<span class="pt"><b style="font-weight:500;font-size:12.5px">'+m.t+'</b>'+
          '<span>'+LAB[m.liv]+(m.fissa?' · '+cadenzaTxt(m):'')+
          (m.s?' · solo '+m.s.join(' e '):'')+'</span></span>'+
          '<span class="stato '+(mt?'att':'')+'">'+(mt?'eccezione':'segue il gruppo')+'</span></div>'+
          (mt&&!mo?barraPerc(m):'')+(mo?controlliPerc(mk,m):'')+'</div>';
      });
    }
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

const evOra=e=>e&&e.ora?e.ora:'';

const evColore=e=>evChi(e)==='Tutti'?'#10231D':COL(evChi(e));
function eventiDi(k){
  return (S.eventi||[]).filter(e=>e.d===k)
    .sort((a,b)=>(evOra(a)||'99').localeCompare(evOra(b)||'99'));
}
function rigaEvento(e,conData){
  const parti=[];
  if(conData) parti.push(dataBreve(e.d));
  if(evOra(e)) parti.push(evOra(e));
  parti.push(evChi(e)==='Tutti'?'tutta la famiglia':'per '+evChi(e));
  if(e.note) parti.push(esc(e.note));
  return '<div class="riga" data-evgo="'+e.d+'">'+
    '<span class="pall" style="background:'+evColore(e)+'"></span>'+
    '<span class="rt"><b>'+esc(e.t)+'</b><span>'+parti.join(' · ')+'</span></span>'+
    '<button class="mini" data-delev="'+e.id+'" aria-label="Togli">×</button></div>';
}
let EV_FORM=null;
function apriEvento(k){
  EV_FORM={d:k||iso(Date.now()),t:'',ora:'',chi:'Tutti',note:''};

}
function disegnaEvento(){
  if(!EV_FORM) return;
  const f=EV_FORM;
  const h='<div class="grab"></div><h3>Nuovo evento</h3>'+
    '<div class="dsub">Compleanni, cene, ospiti, appuntamenti: lo vedono tutti sul calendario.</div>'+
    '<input class="inp" id="evT" placeholder="Cosa succede" value="'+esc(f.t)+'">'+

      '<label class="ev-l">Ora<input class="inp" type="time" id="evO" value="'+f.ora+'"></label>'+
    '</div>'+
    '<div class="ev-chi">'+['Tutti'].concat(G.map(g=>g.n)).map(n=>
      '<button class="ev-b'+(f.chi===n?' on':'')+'" data-evchi="'+n+'"'+
      (n!=='Tutti'?' style="'+(f.chi===n?'background:'+COL(n)+';border-color:'+COL(n):'')+'"':'')+'>'+
      n+'</button>').join('')+'</div>'+
    '<input class="inp" id="evN" placeholder="Nota (facoltativa)" value="'+esc(f.note||'')+'">'+
    '<button class="btn" id="evSalva" style="margin-top:12px">Segna sul calendario</button>'+
    '<button class="btn-g" id="shClose" style="margin-top:8px">Annulla</button>';
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('shClose').onclick=()=>{ EV_FORM=null; chiudiSheet(); };
  const leggi=()=>{ f.t=document.getElementById('evT').value;
    f.d=document.getElementById('evD').value||f.d;
    f.ora=document.getElementById('evO').value;
    f.note=document.getElementById('evN').value; };
  document.querySelectorAll('#sheetIn [data-evchi]').forEach(el=>{
    el.onclick=()=>{ leggi(); f.chi=el.dataset.evchi; disegnaEvento(); };
  });
  document.getElementById('evSalva').onclick=async()=>{
    leggi();
    if(!f.t.trim()){ toast('Scrivi cosa succede.'); return; }
    if(!f.d){ toast('Scegli il giorno.'); return; }
    preparaUndo('Nuovo evento');
    S.eventi.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      d:f.d,t:f.t.trim(),ora:f.ora||'',chi:f.chi,note:(f.note||'').trim(),da:io,ts:Date.now()});
    const quando=dataBreve(f.d)+(f.ora?' alle '+f.ora:'');
    log('evento',io,'Evento: '+f.t.trim()+' · '+quando,0,f.d);
    avvisaTutti('Nuovo evento in famiglia',io+' ha segnato «'+f.t.trim()+'» per '+quando+'.',
      {tag:'evento',vista:'calendario'});
    EV_FORM=null;
    await salva(); chiudiSheet(); disegna();
    toast('Segnato sul calendario.');
  };
}
/* ---- calendario ---- */
function vCalendario(){
  const oggi=new Date();
  if(!calMese) calMese=new Date(oggi.getFullYear(),oggi.getMonth(),1);
  const y=calMese.getFullYear(), mo=calMese.getMonth();
  const off=(new Date(y,mo,1).getDay()+6)%7, gg=new Date(y,mo+1,0).getDate();
  let celle='';
  for(let i=0;i<off;i++) celle+='<div class="day off"></div>';
  for(let d=1;d<=gg;d++){
    const dt=new Date(y,mo,d), k=iso(dt);
    const ev=S.eventi.filter(e=>e.d===k);
    const lg=S.log.filter(l=>l.g===k&&(l.tipo==='fatta'||l.tipo==='rubata'));
    const ri=turniGiorno(k), wk=settimanaKey(dt.getTime()), gh=Object.keys(fantasmiSettimana(wk));
    celle+='<div class="day '+(dt.toDateString()===oggi.toDateString()?'oggi':'')+' '+(ri.length?'rit':'')+(gh.length?' fantasma-day':'')+
      '" data-day="'+k+'" style="animation-delay:'+((off+d)*10)+'ms" title="'+(gh.length?'Fantasma: '+gh.join(', '):'')+'">'+d+
      '<span class="dots">'+
      lg.slice(0,3).map(l=>'<i style="background:'+COL(l.chi)+'"></i>').join('')+
      ev.slice(0,2).map(e=>'<i style="background:'+evColore(e)+'"></i>').join('')+
      ri.slice(0,2).map(r=>'<i style="background:'+r.tp.c+';opacity:.55"></i>').join('')+
      '</span></div>';
  }
  const futuri=(S.eventi||[]).filter(e=>e.d>=iso(oggi))
    .sort((a,b)=>a.d===b.d?(evOra(a)||'99').localeCompare(evOra(b)||'99'):(a.d<b.d?-1:1)).slice(0,8);
  const diario=S.log.filter(l=>l.tipo!=='estrazione').slice(0,8);
  return '<div class="sez"><div class="pan">'+
    '<div class="cal-h"><button class="nav" data-mese="-1">‹</button><b>'+MESI[mo]+' '+y+
    '</b><button class="nav" data-mese="1">›</button></div>'+
    '<div class="dows">'+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>'<span>'+d+'</span>').join('')+'</div>'+
    '<div class="grid">'+celle+'</div>'+
    '<div class="lg"><span><i style="background:#12866B;opacity:.55"></i>ritiro</span>'+
    '<span><i style="background:#10231D;opacity:.7"></i>evento</span>'+
    '<span><i style="background:#C9932F"></i>attività fatta</span></div>'+
    '<p class="p" style="text-align:center;margin:12px 0 0;font-size:11.5px;color:#7B8C85">'+
    'Tocca un giorno per vedere bidoni, attività completate ed eventi.</p></div></div>'+
    '<div class="sez"><h2>Eventi di famiglia</h2><div class="pan">'+
    '<button class="btn" id="bEvento" style="margin:0 0 12px">＋ Nuovo evento</button>'+
    (futuri.length?futuri.map(e=>rigaEvento(e,true)).join('')
     :'<div class="vuoto">Niente in agenda. Compleanni, cene e appuntamenti si segnano da qui.</div>')+'</div></div>'+
    '<div class="sez"><h2>Diario di casa</h2><div class="pan">'+
    (diario.length?diario.map(l=>'<div class="riga">'+
      '<span class="pall" style="background:'+COL(l.chi)+'"></span>'+
      '<span class="rt"><b>'+l.testo+'</b><span>'+l.chi+' · '+etichetta(l.tipo)+' · '+
      new Date(l.ts).toLocaleDateString('it-IT')+'</span></span></div>').join('')
     :'<div class="vuoto">Ancora niente. La prima spunta apre il diario.</div>')+'</div></div>';
}

/* ---- tesoretto ---- */
/* Ricostruisce le multe non ancora versate leggendo il diario a ritroso:
   si ferma all'ultimo versamento di quella persona. */
function vociDebito(n){
  const out=[];
  for(const l of (S.log||[])){
    if(l.chi!==n) continue;
    if(l.tipo==='versamento') break;
    if(l.tipo==='saltata'&&l.val>0) out.push(l);
  }
  return out;
}
function rigaDebito(g){
  const d=Math.round((S.debiti[g.n]||0)*100)/100;
  const v=vociDebito(g.n), mostra=v.slice(0,6);
  const somma=Math.round(v.reduce((a,x)=>a+x.val,0)*100)/100;
  const resto=Math.round((d-somma)*100)/100;
  const max=Math.max(1,...Object.values(S.debiti));
  let det='';
  if(d>0){
    det='<div class="dvoci">'+
      mostra.map(x=>'<div class="dv"><span class="dvt">'+esc(x.testo)+'</span>'+
        '<span class="dvd">'+dataBreve(x.g)+'</span>'+
        '<span class="dvv">'+eur(x.val)+'</span></div>').join('')+
      (v.length>mostra.length?'<div class="dv piu"><span class="dvt">e altre '+
        (v.length-mostra.length)+' voci più vecchie</span><span class="dvv">'+
        eur(Math.round((somma-mostra.reduce((a,x)=>a+x.val,0))*100)/100)+'</span></div>':'')+
      (resto>0.004?'<div class="dv piu"><span class="dvt">Quote precedenti</span>'+
        '<span class="dvv">'+eur(resto)+'</span></div>':'')+
      (!v.length&&resto<=0.004?'<div class="dv piu"><span class="dvt">Nessun dettaglio nel diario</span></div>':'')+
      '</div>';
  }
  return '<div class="debb"><div class="deb"><span class="dn">'+g.n+'</span>'+
    '<span class="trk"><span class="fil" data-w="'+Math.round(d/max*100)+
    '" style="background:'+COL(g.n)+'"></span></span>'+
    '<span class="di">'+eur(d)+'</span>'+
    '<button class="mini" data-versa="'+g.n+'" aria-label="Versato">✓</button></div>'+det+'</div>';
}
function vTesoretto(){
  const daVersare=Object.values(S.debiti).reduce((a,b)=>a+b,0);
  const max=Math.max(1,...Object.values(S.debiti));
  const monete=Math.min(10,Math.max(1,Math.ceil(S.cassa/10)));

/* ---- chi è via (ex modalità fantasma) ---- */
let GHOST_SEL=null;
function panFantasma(){
  const kc=settimanaKey(Date.now()), kp=settimanaProssimaKey();
  /* si apre sulla settimana che ha già qualcuno segnato: è quella che conta */
  if(!GHOST_SEL) GHOST_SEL=assentiSett(kc).length?'corrente':'prossima';
  const k=GHOST_SEL==='corrente'?kc:kp;
  const inizio=lunediDaKey(k), fine=inizio+6*864e5;
  const via=assentiSett(k), attivi=giocatoriAttivi(inizio);
  const ds=Array.from({length:7},(_,i)=>{ const d=new Date(inizio+i*864e5);
    return '<div class="ghost-day"><small>'+DOW[d.getDay()]+'</small><b>'+d.getDate()+'</b></div>'; }).join('');
  const altraK=GHOST_SEL==='corrente'?kp:kc;
  const viaAltra=assentiSett(altraK);
  const righe=G.map(g=>{
    const fuori=via.includes(g.n), suo=g.n===io;
    const anche=viaAltra.includes(g.n)?(GHOST_SEL==='corrente'?' · via anche la prossima':' · via anche questa settimana'):'';
    return '<div class="riga"><span class="pall" style="background:'+COL(g.n)+'"></span>'+
      '<span class="rt"><b>'+g.n+(suo?' · sei tu':'')+'</b><span>'+
      (fuori?'via di casa · fuori dai turni':'in casa · riceve turni e missioni')+anche+'</span></span>'+
      '<button class="btn-sc'+(fuori?' rientro':'')+'" data-ghost="'+k+'|'+g.n+'" aria-label="'+
      (fuori?'Segna che è tornato a casa':'Segna che è via di casa')+'">'+(fuori?'è tornato':'è via')+'</button></div>';
  }).join('');
  return '<div class="ghost-panel">'+
    '<div class="ghost-head"><div class="ghost-icon">👻</div><div><b>Chi è via di casa</b>'+
      '<span>Vacanza o assenza: niente missioni e niente turni per chi non c\'è.</span></div></div>'+
    '<div class="ghost-rule"><b>'+eur(COSTO_VIA)+' di quota</b><span>Chi si segna via se li ritrova fra le quote da versare in cassa comune '+
      'e lascia un suo gettone a ciascuno degli altri. Bidoni e servizi si dividono fra chi resta in casa; '+
      'missioni aperte, Flash ricevute e turni passati con un gettone tornano indietro.</span></div>'+
    '<div class="ghost-week-title"><small>SETTIMANA</small><b>'+dataBreve(k)+' → '+dataBreve(iso(new Date(fine)))+'</b></div>'+
    '<div class="gsw"><button class="'+(GHOST_SEL==='corrente'?'on':'')+'" data-gw="corrente">Questa settimana'+
      (assentiSett(kc).length?' · '+assentiSett(kc).length+' via':'')+'</button>'+
      '<button class="'+(GHOST_SEL==='prossima'?'on':'')+'" data-gw="prossima">La prossima'+
      (assentiSett(kp).length?' · '+assentiSett(kp).length+' via':'')+'</button></div>'+
    '<div class="ghost-calendar">'+ds+'</div>'+
    '<div class="ghost-week"><div><small>GIÀ SEGNATI</small></div>'+ghostWeekChip(k)+'</div>'+
    '<div class="pan" style="margin-top:10px">'+righe+'</div>'+
    '<p class="ghost-note">In casa questa settimana: '+attivi.length+' su '+G.length+'. '+
    (attivi.length<G.length
      ? 'Con meno di quattro persone i servizi non si dividono più in blocchi lunedì-giovedì e venerdì-domenica: si dividono <b>giorno per giorno</b>, a turno, così nessuno si tiene lo stesso servizio per tutta la settimana.'
      : 'Con tutti in casa i servizi restano divisi in blocchi: lunedì-giovedì e venerdì-domenica.')+
    ' Se segni un\'assenza a settimana già cominciata, i giorni passati restano a chi li aveva: cambiano solo i giorni che restano.</p>'+
    '</div>';
}

function anteprimaBottega(o){
  const c=COL(io);
  if(o.tipo==='colore'){
    const col=COLORI_BOTTEGA[o.id];
    return '<span class="bot-pv'+(col.ink==='#FFFFFF'?'':' chiaro')+(o.id==='metal'?' col-metal':'')+
      '" style="background:'+col.h+';color:'+col.ink+'">'+INI(io)+'</span>';
  }
  if(o.tipo==='timbro'&&o.svg) return '<span class="bot-pv" style="background:'+c+'">'+
    '<span class="timbro tsvg" style="background-image:url(\''+o.svg+'\');width:17px;height:17px"></span></span>';
  if(o.tipo==='coriandoli'&&(o.id==='foglie'||o.id==='dischi')){
    const set=PALETTE_CORIANDOLI[o.id];
    return '<span class="bot-pv" style="background:'+set.colori[0]+'">'+(o.id==='foglie'?'✤':'●')+'</span>';
  }
  if(o.tipo==='cornice') return '<span class="bot-pv cos-'+o.id+'" style="background:'+c+'">'+INI(io)+'</span>';
  if(o.tipo==='casella') return '<span class="bot-pv fin-'+o.id+'" style="background:'+c+';border-radius:10px">✓</span>';
  if(o.tipo==='coriandoli'){
    const set=PALETTE_CORIANDOLI[o.id]||{colori:['#ccc','#999','#777']};
    return '<span class="bot-pv" style="background:linear-gradient(135deg,'+
      set.colori.slice(0,3).join(',')+')">✻</span>';
  }
  return '<span class="bot-pv" style="background:'+c+'">'+(o.mark||'★')+'</span>';
}
function cardBottega(o){
  const mio=haOggetto(io,o.id), on=indossati(io)[o.tipo]===o.id;
  const inPr=!!(PROVA&&((o.tipo==='colore'&&PROVA.colore===o.id)||((PROVA.pezzi||{})[o.tipo]===o.id)));
  const gt=gettoniDi(io);
  const inTasca=G.reduce((a,g)=>a+(g.n===io?0:(gt[g.n]||0)),0);
  const preso=o.tipo==='colore'&&(coloreOccupatoDa(COLORI_BOTTEGA[o.id].h)||null);
  const altrui=!!(preso&&preso!==io);
  const puoi=inTasca>=o.costo&&restaInBottega(io)>=o.costo&&!altrui;
  const azioni=mio
    ? '<button class="bot-b'+(on?' off':'')+'" data-boton="'+o.tipo+'|'+(on?'':o.id)+'">'+(on?'Togli':'Metti')+'</button>'
    : (altrui?'<span class="bot-costo">di '+preso+'</span>'
      :'<span class="bot-costo">'+o.costo+'🎟</span>'+
       '<button class="bot-b'+(inPr?' provando':' off')+'" data-prova="'+o.id+'">'+(inPr?'Basta':'Prova')+'</button>'+
       '<button class="bot-b" data-bot="'+o.id+'"'+(puoi?'':' disabled')+'>Compra</button>');
  return '<div class="bot-r'+(on?' mio':'')+(inPr?' inprova':'')+'">'+
    anteprimaBottega(o)+
    '<span class="bot-txt"><b>'+o.nome+'</b><span>'+(mio?(on?'lo indossi':'in armadio'):o.dett)+'</span></span>'+
    '<span class="bot-az">'+azioni+'</span></div>';
}

/* scelta di chi paga: si possono mischiare i gettoni di persone diverse */
let PAGA=null;
function apriAcquisto(id){
  if(!oggettoBottega(id)) return;
  PAGA={id,sel:{}};
  document.getElementById('sheet').classList.add('on');
  disegnaAcquisto();
}
function disegnaAcquisto(){
  if(!PAGA) return;
  const o=oggettoBottega(PAGA.id), gt=gettoniDi(io);
  const scelti=Object.keys(PAGA.sel).reduce((a,n)=>a+(PAGA.sel[n]||0),0);
  const disp=G.filter(g=>g.n!==io&&(gt[g.n]||0)>0);
  const totali=disp.reduce((a,g)=>a+(gt[g.n]||0),0);
  let h='<div class="grab"></div><h3>'+esc(o.nome)+'</h3>'+
    '<div class="dsub">Costa '+o.costo+(o.costo===1?' gettone':' gettoni')+'. Puoi mischiare: uno di una '+
    'persona e uno di un\'altra, come preferisci.</div>';
  h+='<div class="pan">'+(disp.length?disp.map(g=>{
      const q=gt[g.n]||0, n=PAGA.sel[g.n]||0;
      return '<div class="riga"><span class="pall" style="background:'+g.h+'"></span>'+
        '<span class="rt"><b>'+g.n+'</b><span>hai '+q+(q===1?' gettone':' gettoni')+'</span></span>'+
        '<span class="pctrl" style="margin:0"><span class="pline" style="margin:0">'+
        '<button data-pag="-|'+g.n+'"'+(n<=0?' disabled':'')+'>−</button>'+
        '<span class="vv">'+n+'</span>'+
        '<button data-pag="+|'+g.n+'"'+((n>=q||scelti>=o.costo)?' disabled':'')+'>+</button>'+
        '</span></span></div>';
    }).join('')
    :'<div class="vuoto">Non hai gettoni di nessuno. Copri il turno di qualcuno e te ne guadagni uno.</div>')+'</div>';
  h+='<div class="bot-p" style="margin-top:12px"><b>'+scelti+' / '+o.costo+' gettoni scelti</b>'+
    '<button class="bot-b" id="botPaga"'+(scelti===o.costo?'':' disabled')+'>Paga</button></div>';
  if(totali<o.costo) h+='<p class="p" style="margin:9px 0 0;font-size:11.5px;color:#7B8C85">'+
    'In tutto hai '+totali+(totali===1?' gettone':' gettoni')+': te ne '+(o.costo-totali===1?'manca uno':'mancano '+(o.costo-totali))+'.</p>';
  if(restaInBottega(io)<o.costo) h+='<p class="p" style="margin:9px 0 0;font-size:11.5px;color:#BC3B26">'+
    'Questa settimana nello Shop puoi ancora spendere '+restaInBottega(io)+
    (restaInBottega(io)===1?' gettone':' gettoni')+'.</p>';
  h+='<button class="btn-g" id="shClose" style="margin-top:12px">Chiudi</button>';
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('shClose').onclick=()=>{ PAGA=null; chiudiSheet(); };
  document.querySelectorAll('#sheetIn [data-pag]').forEach(el=>{
    el.onclick=()=>{
      if(el.disabled) return;
      const [segno,chi]=el.dataset.pag.split('|');
      const q=gettoniDi(io)[chi]||0;
      const ora=PAGA.sel[chi]||0;
      PAGA.sel[chi]=segno==='+'?Math.min(q,ora+1):Math.max(0,ora-1);
      disegnaAcquisto();
    };
  });
  const bp=document.getElementById('botPaga');
  if(bp) bp.onclick=async()=>{
    if(bp.disabled) return;
    const sel=PAGA.sel, id=PAGA.id;
    PAGA=null; chiudiSheet();
    await compra(id,sel);
  };
}

/* ==================== AZIONI ==================== */
async function toggleSpazz(k){
  const t=turnoK(k); if(!t) return;
  const nome='Bidone '+t.tp.nome.toLowerCase();
  const scaduto=chiusoT(t);
  const stessaSett=settimanaKey(new Date(t.giorno+'T12:00').getTime())===settimanaKey(S.inizio||Date.now());
  /* Dopo le 07:00 il turno resta recuperabile fino alla fine della settimana:
     chi lo segna in ritardo si riprende anche la penale già addebitata. */
  if(scaduto&&!t.fatta&&!stessaSett){ toast('Questo turno è di una settimana chiusa: non si recupera più.'); return; }
  if(t.fatta){
    if(t.fattoDa&&t.fattoDa!==io){ toast('L\'ha spuntato '+t.fattoDa+'. Solo lui può toglierlo.'); return; }
    if(!confermaTogli(nome)) return;
    if(t.fattoDa&&t.fattoDa!==t.chi){ muoviGettone(t.fattoDa,t.chi,-1); cnt(t.fattoDa).gtUsati-=1;
      cnt(t.fattoDa).coperti=Math.max(0,cnt(t.fattoDa).coperti-1); }
    else cnt(io).bidoni=Math.max(0,cnt(io).bidoni-1);
    delete S.spazz[k];
    S.log=S.log.filter(l=>l.rif!==k||l.tipo==='saltata');
    const tornata=ripristinaAddebito(k);
    etichettaUndo('Spunta tolta · '+nome+(tornata?' · penale di '+eur(tornata)+' di nuovo in conto':''));
  }else{
    const suo=t.chi===io;
    if(!suo&&!confirm(nome+' è di '+t.chi+'. Se lo porti fuori tu non paga nessuno: '+
      'ti guadagni un gettone di '+t.chi+'. Procedo?')) return;
    const tolta=annullaAddebito(k);
    S.spazz[k]={fatta:true,chi:io,ts:Date.now()};
    if(suo){ cnt(io).bidoni++; log('fatta',io,nome+(scaduto?' fuori (recuperato)':' fuori'),0,t.giorno,k);
      const msgB=tolta?'Recuperato ✓ · penale di '+eur(tolta)+' annullata':'Bidone fuori. Zero euro in cassa.';
      etichettaUndo(msgB); toast(msgB); }
    else{
      muoviGettone(io,t.chi,1); cnt(io).coperti++;
      log('coperto',io,nome+' al posto di '+t.chi,0,t.giorno,k);
      avvisa(t.chi,'Turno coperto',io+' ha portato fuori '+t.tp.nome.toLowerCase()+
        ' al posto tuo. Niente penale, ma ora ha un tuo gettone.',{tag:'turno-'+k,vista:'spazzatura'});
      const msgK='Coperto. Hai guadagnato un gettone di '+t.chi+'.'+(tolta?' Penale di '+eur(tolta)+' annullata.':'');
      etichettaUndo(msgK); toast(msgK);
    }
  }
  await salva();
}

function weekKeyForService(t){ return t&&t.k ? settimanaKey(new Date(t.giorno+'T12:00').getTime()) : ''; }
async function toggleServ(k){
  const t=servizioK(k);
  if(!t) return {ok:false,reason:'not-found'};
  const oggi=iso(Date.now()), isCurrentWeek=weekKeyForService(t)===settimanaKey(S.inizio||Date.now());
  /* Chi è via non ha turni suoi, ma se rientra prima può sempre dare una mano:
     copre il turno di un altro e si guadagna il suo gettone, come tutti. */
  if(t.fatta){
    // Una spunta appartiene sempre a chi l'ha materialmente fatta.
    // Quindi chi l'ha messa può toglierla anche se il turno è sulla card di un'altra persona.
    if(t.fattoDa!==io){
      toast('Può annullare la spunta solo '+(t.fattoDa||t.chi)+'.');
      return {ok:false,reason:'other-done'};
    }
    if(!confermaTogli(t.sv.nome)) return {ok:false,reason:'cancel'};

    const eraCopertura=t.fattoDa!==t.chi;
    const titolare=t.chi;
    /* Cattura lo stato ESATTAMENTE prima della modifica del servizio.
       Il listener globale resta come rete di sicurezza, ma questa cattura è
       quella autorevole per evitare qualsiasi differenza di timing su Android. */
    preparaUndo(eraCopertura
      ? 'Copertura annullata · '+t.sv.nome+' · '+dataBreve(t.giorno)
      : 'Spunta annullata · '+t.sv.nome+' · '+dataBreve(t.giorno),
      {kind:'servizio',k});
    if(eraCopertura){
      // Restituisce esattamente il gettone persona che era stato guadagnato.
      muoviGettone(io,titolare,-1);
      cnt(io).gtUsati=Math.max(0,cnt(io).gtUsati-1);
      cnt(io).coperti=Math.max(0,cnt(io).coperti-1);
    }else{
      cnt(io).servizi=Math.max(0,cnt(io).servizi-1);
    }
    /* Manteniamo una voce esplicita con fatta:false invece di eliminarla.
       Questo rende il passaggio irreversibile solo quando l'utente lo decide
       e, soprattutto, forza il rendering della casella a tornare neutro. */
    S.serv[k]={fatta:false,chi:t.chi,ts:Date.now()};
    S.log=S.log.filter(l=>l.rif!==k||l.tipo==='saltata');
    const tornata=ripristinaAddebito(k);
    const msg=(eraCopertura
      ? 'Copertura annullata · gettone di '+titolare+' restituito.'
      : 'Spunta annullata · turno nuovamente aperto.')+
      (tornata?' Penale di '+eur(tornata)+' di nuovo in conto.':'');
    etichettaUndo(msg);
    await salva();
    toast(msg);
    return {ok:true,completed:false,covered:false,wasCover:eraCopertura,owner:titolare};
  }

  if(t.giorno>oggi){ toast('Questa giornata non è ancora arrivata.'); return {ok:false,reason:'future'}; }
  if(!isCurrentWeek){ toast('Puoi recuperare solo i giorni della settimana in corso.'); return {ok:false,reason:'old-week'}; }
  const suo=t.chi===io;
  /* Cattura lo stato esatto prima di aprire la casella. Questo è importante
     soprattutto per i recuperi dei giorni passati e per i tap su un turno
     appartenente a un'altra persona. */
  preparaUndo((suo?'Servizio completato':'Copertura del servizio')+' · '+t.sv.nome+' · '+dataBreve(t.giorno),
    {kind:'servizio',k});
  /* Recupero di una serata saltata: la penale già addebitata viene tolta. */
  const tolta=annullaAddebito(k);
  S.serv[k]={fatta:true,chi:io,ts:Date.now()};
  if(suo){
    cnt(io).servizi++; log('fatta',io,t.sv.nome,0,t.giorno,k);
    const msg='Servizio completato ✓'+(tolta?' · penale di '+eur(tolta)+' annullata':'');
    etichettaUndo(msg);
    await salva();
    toast(msg);
    return {ok:true,completed:true,covered:false,owner:t.chi};
  }

  muoviGettone(io,t.chi,1);
  cnt(io).coperti++;
  log('coperto',io,t.sv.nome+' al posto di '+t.chi,0,t.giorno,k);
  avvisa(t.chi,'Turno coperto',io+' ha fatto «'+t.sv.nome+'» al posto tuo. Hai lasciato a '+io+' un tuo gettone.',{tag:'turno-'+k,vista:'servizi'});
  const msgC='Turno coperto ✓ · +1 gettone di '+t.chi+(tolta?' · penale di '+eur(tolta)+' annullata':'');
  etichettaUndo(msgC);
  await salva();
  toast(msgC);
  return {ok:true,completed:true,covered:true,owner:t.chi};
}

function b64u8(b){
  const p='='.repeat((4-b.length%4)%4);
  const t=(b+p).replace(/-/g,'+').replace(/_/g,'/'), r=atob(t), a=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++) a[i]=r.charCodeAt(i);
  return a;
}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
  (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const INSTALLATA=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const SUPPORTO=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;

const PUSH={supporto:false,installata:false,permesso:'?',iscritto:false,chi:null,
  disp:[],ultimo:'',caricato:false};

async function iscrizioneCorrente(){
  if(!SUPPORTO()) return null;
  try{
    const r=await navigator.serviceWorker.getRegistration();
    if(!r) return null;
    return await r.pushManager.getSubscription();
  }catch(e){ return null; }
}
async function aggiornaPush(ridisegna){
  PUSH.supporto=SUPPORTO();
  PUSH.installata=INSTALLATA();
  PUSH.permesso=PUSH.supporto?Notification.permission:'non disponibile';
  const s=await iscrizioneCorrente();
  PUSH.iscritto=!!s; PUSH.chi=null;
  if(sb){
    if(s){
      try{ const {data}=await sb.from('push').select('chi').eq('endpoint',s.endpoint).maybeSingle();
        PUSH.chi=data?data.chi:null; }catch(e){}
    }
    try{ const {data}=await sb.from('push').select('chi,agg').eq('casa',SUPA.casa);
      PUSH.disp=data||[]; }catch(e){ PUSH.disp=[]; }
  }
  PUSH.caricato=true;
  if(ridisegna&&vista==='notifiche'&&io) disegna();
}

/* Il permesso va chiesto per primo, appena tocchi il pulsante: se prima aspettiamo
   altre cose iOS considera scaduto il gesto e non chiede più niente. */
async function attivaPush(){
  if(!io){ toast('Prima scegli chi sei.'); return; }
  if(!SUPPORTO()){
    toast(IOS&&!INSTALLATA()
      ? 'Su iPhone prima aggiungi l\'app alla schermata Home, poi aprila da lì.'
      : 'Questo browser non gestisce le notifiche.');
    aggiornaPush(true); return;
  }
  if(IOS&&!INSTALLATA()){
    toast('Su iPhone le notifiche arrivano solo dall\'app aggiunta alla Home.');
    aggiornaPush(true); return;
  }
  let perm='default';
  try{ perm=await Notification.requestPermission(); }
  catch(e){ PUSH.ultimo='permesso: '+(e.message||e); }
  if(perm!=='granted'){
    toast(perm==='denied'
      ? 'Permesso negato. Si riapre dalle impostazioni del telefono.'
      : 'Permesso non concesso. Riprova toccando il pulsante.');
    aggiornaPush(true); return;
  }
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub){ try{ await sub.unsubscribe(); }catch(e){} }
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,
      applicationServerKey:b64u8(SUPA.vapid)});
    if(!sb){ toast('Sincronizzazione non ancora pronta: riprova fra qualche secondo.'); return; }
    const j=sub.toJSON();
    const {error}=await sb.from('push').upsert({endpoint:j.endpoint,casa:SUPA.casa,chi:io,sub:j,
      agg:new Date().toISOString()},{onConflict:'endpoint'});
    if(error) throw error;
    try{ localStorage.setItem('casa-push',io); }catch(e){}
    PUSH.ultimo='iscrizione salvata';
    toast('Notifiche attive per '+io+' su questo dispositivo.');
    await aggiornaPush(true);
  }catch(e){
    PUSH.ultimo='errore: '+((e&&e.message)||e);
    toast('Non ci sono riuscito. Guarda il dettaglio qui sotto.');
    aggiornaPush(true);
  }
}

  if(s){
    try{ if(sb) await sb.from('push').delete().eq('endpoint',s.endpoint); }catch(e){}
